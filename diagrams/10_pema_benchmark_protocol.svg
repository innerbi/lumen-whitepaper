<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="780" height="380" fill="none"/>
  <rect width="780" height="380" fill="url(#grid)" opacity="0.4"/>

  <!-- Title bar -->
  <rect x="25" y="15" width="730" height="50" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="390" y="47" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3b82f6" text-anchor="middle" letter-spacing="2">PROTOCOLO PEMA BENCHMARK</text>

  <!-- Phase 1: BASELINE -->
  <rect x="40" y="80" width="120" height="70" rx="6" fill="#1a1a1a" stroke="#888888" stroke-width="2"/>
  <text x="100" y="108" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">FASE 1</text>
  <text x="100" y="130" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#888888" text-anchor="middle">BASELINE</text>

  <!-- Arrow 1-2 -->
  <line x1="160" y1="120" x2="185" y2="120" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 2: STRESS -->
  <rect x="195" y="80" width="120" height="70" rx="6" fill="#1a1a1a" stroke="#ef4444" stroke-width="2"/>
  <text x="255" y="108" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">FASE 2</text>
  <text x="255" y="130" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ef4444" text-anchor="middle">STRESS</text>

  <!-- Arrow 2-3 -->
  <line x1="315" y1="120" x2="340" y2="120" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 3: RECOVERY -->
  <rect x="350" y="80" width="120" height="70" rx="6" fill="#1a1a1a" stroke="#22c55e" stroke-width="2"/>
  <text x="410" y="108" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">FASE 3</text>
  <text x="410" y="130" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#22c55e" text-anchor="middle">RECOVERY</text>

  <!-- Arrow 3-4 -->
  <line x1="470" y1="120" x2="495" y2="120" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 4: STABILITY -->
  <rect x="505" y="80" width="120" height="70" rx="6" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
  <text x="565" y="108" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">FASE 4</text>
  <text x="565" y="130" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#3b82f6" text-anchor="middle">STABILITY</text>

  <!-- Arrow 4-5 -->
  <line x1="625" y1="120" x2="650" y2="120" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 5: TRANSFER -->
  <rect x="660" y="80" width="100" height="70" rx="6" fill="#1a1a1a" stroke="#888888" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="710" y="108" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">FASE 5</text>
  <text x="710" y="130" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#888888" text-anchor="middle">TRANSFER</text>

  <!-- Details section -->
  <rect x="40" y="175" width="700" height="185" rx="4" fill="#0d0d0d" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Phase details -->
  <circle cx="60" cy="205" r="5" fill="#888888"/>
  <text x="80" y="210" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#888888">BASELINE</text>
  <text x="180" y="210" font-family="Arial, sans-serif" font-size="12" fill="#aaaaaa">Plasticidad OFF · Capturar μ, σ · Establecer bounds</text>

  <circle cx="60" cy="240" r="5" fill="#ef4444"/>
  <text x="80" y="245" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ef4444">STRESS</text>
  <text x="180" y="245" font-family="Arial, sans-serif" font-size="12" fill="#aaaaaa">Plasticidad ON · Inyectar 30% errores · Observar mutaciones</text>

  <circle cx="60" cy="275" r="5" fill="#22c55e"/>
  <text x="80" y="280" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#22c55e">RECOVERY</text>
  <text x="180" y="280" font-family="Arial, sans-serif" font-size="12" fill="#aaaaaa">Episodios normales · Medir velocidad recuperación</text>

  <circle cx="60" cy="310" r="5" fill="#3b82f6"/>
  <text x="80" y="315" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#3b82f6">STABILITY</text>
  <text x="180" y="315" font-family="Arial, sans-serif" font-size="12" fill="#aaaaaa">Consolidación · σ² ≤ baseline × 1.1 · Topología final</text>

  <circle cx="60" cy="345" r="5" fill="#888888" stroke="#888888" stroke-dasharray="2,1"/>
  <text x="80" y="350" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#888888">TRANSFER</text>
  <text x="180" y="350" font-family="Arial, sans-serif" font-size="12" fill="#666666">Evaluar en dominio diferente · Medir degradación</text>

</svg>
