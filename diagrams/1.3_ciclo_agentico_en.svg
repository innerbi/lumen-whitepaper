<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 650" width="750" height="650">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#000" flood-opacity="0.4"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="750" height="650" fill="none"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="750" height="650" fill="url(#grid)" opacity="0.5"/>

  <!-- Title bar -->
  <rect x="30" y="25" width="690" height="60" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="375" y="62" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">AGENTIC CYCLE</text>

  <!-- Main container (10px gap below title) -->
  <rect x="30" y="95" width="690" height="530" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- PERCEIVE box -->
  <rect x="115" y="140" width="150" height="50" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="190" y="172" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">PERCEIVE</text>

  <!-- Arrow and description for PERCEIVE -->
  <line x1="285" y1="165" x2="315" y2="165" stroke="#666666" stroke-width="1.5"/>
  <polygon points="285,160 275,165 285,170" fill="#666666"/>
  <text x="325" y="170" font-family="Arial, sans-serif" font-size="14" fill="#888888">Observe environment, read results</text>

  <!-- Arrow down from PERCEIVE -->
  <line x1="190" y1="190" x2="190" y2="235" stroke="#333333" stroke-width="1.5"/>
  <polygon points="185,235 190,245 195,235" fill="#333333"/>

  <!-- REASON box -->
  <rect x="115" y="250" width="150" height="50" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="190" y="282" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">REASON</text>

  <!-- Arrow and description for REASON -->
  <line x1="285" y1="275" x2="315" y2="275" stroke="#666666" stroke-width="1.5"/>
  <polygon points="285,270 275,275 285,280" fill="#666666"/>
  <text x="325" y="280" font-family="Arial, sans-serif" font-size="14" fill="#888888">Analyze, plan, decide</text>

  <!-- Arrow down from REASON -->
  <line x1="190" y1="300" x2="190" y2="345" stroke="#333333" stroke-width="1.5"/>
  <polygon points="185,345 190,355 195,345" fill="#333333"/>

  <!-- ACT box -->
  <rect x="115" y="360" width="150" height="50" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="190" y="392" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">ACT</text>

  <!-- Arrow and description for ACT -->
  <line x1="285" y1="385" x2="315" y2="385" stroke="#666666" stroke-width="1.5"/>
  <polygon points="285,380 275,385 285,390" fill="#666666"/>
  <text x="325" y="390" font-family="Arial, sans-serif" font-size="14" fill="#888888">Execute tool, generate output</text>

  <!-- Arrow down from ACT -->
  <line x1="190" y1="410" x2="190" y2="455" stroke="#333333" stroke-width="1.5"/>
  <polygon points="185,455 190,465 195,455" fill="#333333"/>

  <!-- EVALUATE box -->
  <rect x="115" y="470" width="150" height="50" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="190" y="502" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">EVALUATE</text>

  <!-- Arrow and description for EVALUATE -->
  <line x1="285" y1="495" x2="315" y2="495" stroke="#666666" stroke-width="1.5"/>
  <polygon points="285,490 275,495 285,500" fill="#666666"/>
  <text x="325" y="500" font-family="Arial, sans-serif" font-size="14" fill="#888888">Verify result, adjust model</text>

  <!-- Arrow down from EVALUATE and loop -->
  <line x1="190" y1="520" x2="190" y2="570" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="190" y1="570" x2="325" y2="570" stroke="#3b82f6" stroke-width="1.5"/>
  <polygon points="325,565 335,570 325,575" fill="#3b82f6"/>

  <!-- Repeat text -->
  <text x="345" y="575" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3b82f6">Repeat until goal achieved</text>

  <!-- Feedback loop going up (left side) -->
  <line x1="95" y1="165" x2="95" y2="495" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="95" y1="165" x2="115" y2="165" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="95" y1="495" x2="115" y2="495" stroke="#3b82f6" stroke-width="1.5"/>

</svg>
