<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 530" width="850" height="530">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888888"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="530" fill="none"/>
  <rect width="850" height="530" fill="url(#grid)" opacity="0.5"/>

  <!-- Title bar -->
  <rect x="25" y="20" width="800" height="60" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="425" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" letter-spacing="2">ARQUITECTURA EVOLUTIVA</text>

  <!-- Main container (10px gap below title) -->
  <rect x="25" y="90" width="800" height="420" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Generation N -->
  <rect x="110" y="120" width="210" height="150" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2" rx="8" stroke-dasharray="4,2"/>
  <text x="215" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3b82f6">GENERACION N</text>

  <rect x="130" y="165" width="55" height="40" fill="#1a1a1a" stroke="#3b82f6" stroke-width="1" rx="4"/>
  <text x="157" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">A1</text>

  <rect x="195" y="165" width="55" height="40" fill="#1a1a1a" stroke="#3b82f6" stroke-width="1" rx="4"/>
  <text x="222" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">A2</text>

  <rect x="130" y="215" width="55" height="40" fill="#1a1a1a" stroke="#3b82f6" stroke-width="1" rx="4"/>
  <text x="157" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">A3</text>

  <rect x="195" y="215" width="55" height="40" fill="#1a1a1a" stroke="#666666" stroke-width="1" rx="4"/>
  <text x="222" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666666">...</text>

  <!-- Arrow to Selection -->
  <line x1="330" y1="195" x2="390" y2="195" stroke="#888888" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="360" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888888">Selección</text>
  <text x="360" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888888">+ Mutación</text>

  <!-- Generation N+1 -->
  <rect x="400" y="120" width="210" height="150" fill="#1a1a1a" stroke="#22c55e" stroke-width="2" rx="8" stroke-dasharray="4,2"/>
  <text x="505" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#22c55e">GENERACION N+1</text>

  <rect x="420" y="165" width="55" height="40" fill="#1a1a1a" stroke="#22c55e" stroke-width="1" rx="4"/>
  <text x="447" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">A1'</text>

  <rect x="485" y="165" width="55" height="40" fill="#1a1a1a" stroke="#3b82f6" stroke-width="1" rx="4"/>
  <text x="512" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">A4</text>

  <rect x="550" y="165" width="55" height="40" fill="#1a1a1a" stroke="#22c55e" stroke-width="1" rx="4"/>
  <text x="577" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">A2'</text>

  <!-- Fitness Evaluation -->
  <rect x="110" y="305" width="500" height="90" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" rx="8" stroke-dasharray="4,2"/>
  <text x="360" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">FITNESS EVALUATION</text>

  <rect x="140" y="350" width="110" height="35" fill="#1a1a1a" stroke="#666666" stroke-width="1" rx="4"/>
  <text x="195" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888888">Task Perf: 0.85</text>

  <rect x="270" y="350" width="110" height="35" fill="#1a1a1a" stroke="#666666" stroke-width="1" rx="4"/>
  <text x="325" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888888">Eficiencia: 0.72</text>

  <rect x="400" y="350" width="110" height="35" fill="#1a1a1a" stroke="#666666" stroke-width="1" rx="4"/>
  <text x="455" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888888">Precisión: 0.91</text>

  <!-- Genetic Operators -->
  <rect x="110" y="425" width="500" height="60" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" rx="8" stroke-dasharray="4,2"/>
  <text x="360" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">Selección (top-k) → Crossover (combina) → Mutación (explora)</text>

  <!-- Arrows connecting sections -->
  <path d="M 215 270 L 215 300" stroke="#888888" stroke-width="1" marker-end="url(#arrowhead)"/>
  <path d="M 505 270 L 505 300" stroke="#888888" stroke-width="1" marker-end="url(#arrowhead)"/>
  <path d="M 360 400 L 360 420" stroke="#888888" stroke-width="1" marker-end="url(#arrowhead)"/>

  <!-- Cycle arrow -->
  <path d="M 610 455 Q 680 455 680 195 Q 680 120 620 120" stroke="#3b82f6" stroke-width="1" fill="none" stroke-dasharray="5,5"/>
  <polygon points="620,115 610,120 620,125" fill="#3b82f6"/>

  <!-- Legend -->
  <rect x="630" y="305" width="195" height="115" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" rx="6"/>
  <text x="727" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#888888">Características:</text>
  <circle cx="645" cy="355" r="3" fill="#3b82f6"/>
  <text x="660" y="358" font-family="Arial, sans-serif" font-size="10" fill="#888888">Agentes compiten por tareas</text>
  <circle cx="645" cy="380" r="3" fill="#3b82f6"/>
  <text x="660" y="383" font-family="Arial, sans-serif" font-size="10" fill="#888888">Los más aptos se replican</text>
  <circle cx="645" cy="405" r="3" fill="#3b82f6"/>
  <text x="660" y="408" font-family="Arial, sans-serif" font-size="10" fill="#888888">Población mejora sin diseño</text>
</svg>
