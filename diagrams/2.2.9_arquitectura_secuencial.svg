<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="530" fill="none"/>
  <rect width="800" height="530" fill="url(#grid)" opacity="0.5"/>

  <!-- Title bar -->
  <rect x="25" y="20" width="750" height="60" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="400" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" letter-spacing="2">ARQUITECTURA SECUENCIAL (Pipeline)</text>

  <!-- Main container (10px gap below title) -->
  <rect x="25" y="90" width="750" height="420" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Input -->
  <rect x="40" y="170" width="90" height="70" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2" rx="4"/>
  <text x="85" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3b82f6">Input</text>

  <!-- Arrow 1 -->
  <line x1="135" y1="205" x2="175" y2="205" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead2)"/>

  <!-- Agent A -->
  <rect x="185" y="150" width="130" height="110" fill="#1a1a1a" stroke="#3b82f6" stroke-width="1" rx="4"/>
  <text x="250" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Agent A</text>
  <text x="250" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888888">(Parse)</text>

  <!-- Arrow 2 -->
  <line x1="320" y1="205" x2="360" y2="205" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead2)"/>

  <!-- Agent B -->
  <rect x="370" y="150" width="130" height="110" fill="#1a1a1a" stroke="#3b82f6" stroke-width="1" rx="4"/>
  <text x="435" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Agent B</text>
  <text x="435" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888888">(Process)</text>

  <!-- Arrow 3 -->
  <line x1="505" y1="205" x2="545" y2="205" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead2)"/>

  <!-- Agent C -->
  <rect x="555" y="150" width="130" height="110" fill="#1a1a1a" stroke="#3b82f6" stroke-width="1" rx="4"/>
  <text x="620" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Agent C</text>
  <text x="620" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888888">(Format)</text>

  <!-- Arrow 4 -->
  <line x1="690" y1="205" x2="730" y2="205" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead2)"/>

  <!-- Output -->
  <rect x="670" y="170" width="90" height="70" fill="#1a1a1a" stroke="#22c55e" stroke-width="2" rx="4"/>
  <text x="715" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#22c55e">Output</text>

  <!-- Example -->
  <rect x="50" y="290" width="700" height="55" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" rx="4" stroke-dasharray="4,2"/>
  <text x="400" y="323" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#888888">Ejemplo: Query → RouterAgent → DAXAgent → FormatterAgent → Response</text>

  <!-- Characteristics -->
  <rect x="50" y="370" width="700" height="100" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" rx="4"/>
  <circle cx="75" cy="405" r="4" fill="#3b82f6"/>
  <text x="95" y="410" font-family="Arial, sans-serif" font-size="12" fill="#888888">Flujo determinístico</text>
  <circle cx="300" cy="405" r="4" fill="#3b82f6"/>
  <text x="320" y="410" font-family="Arial, sans-serif" font-size="12" fill="#888888">Responsabilidad única</text>
  <circle cx="530" cy="405" r="4" fill="#3b82f6"/>
  <text x="550" y="410" font-family="Arial, sans-serif" font-size="12" fill="#888888">Fácil debugging</text>
  <circle cx="75" cy="440" r="4" fill="#3b82f6"/>
  <text x="95" y="445" font-family="Arial, sans-serif" font-size="12" fill="#888888">Cada agente transforma el output del anterior</text>
</svg>
