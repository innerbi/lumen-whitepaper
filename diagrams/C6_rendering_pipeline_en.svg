<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 540" width="750" height="540">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.1"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="750" height="540" fill="none"/>
  
  <!-- Header -->
  <rect x="40" y="25" width="670" height="50" rx="0" fill="#1a365d" filter="url(#shadow)"/>
  <text x="375" y="57" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">RENDERING PIPELINE</text>
  
  <!-- Main container -->
  <rect x="40" y="90" width="670" height="420" rx="0" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Flow boxes -->
  <!-- SSE chunks -->
  <rect x="60" y="110" width="110" height="40" rx="3" fill="#ffffff" stroke="#2b6cb0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="110" width="110" height="4" fill="#2b6cb0"/>
  <text x="115" y="137" font-family="Consolas, monospace" font-size="11" font-weight="600" fill="#2b6cb0" text-anchor="middle">SSE chunks</text>
  
  <!-- Arrow -->
  <line x1="170" y1="130" x2="205" y2="130" stroke="#4a5568" stroke-width="2"/>
  <polygon points="200,126 210,130 200,134" fill="#4a5568"/>
  
  <!-- Accumulate -->
  <rect x="215" y="110" width="110" height="40" rx="3" fill="#ffffff" stroke="#38a169" stroke-width="2" filter="url(#shadow)"/>
  <rect x="215" y="110" width="110" height="4" fill="#38a169"/>
  <text x="270" y="137" font-family="Consolas, monospace" font-size="11" font-weight="600" fill="#38a169" text-anchor="middle">Accumulate</text>
  
  <!-- Arrow -->
  <line x1="325" y1="130" x2="360" y2="130" stroke="#4a5568" stroke-width="2"/>
  <polygon points="355,126 365,130 355,134" fill="#4a5568"/>
  
  <!-- Parse blocks -->
  <rect x="370" y="110" width="120" height="40" rx="3" fill="#ffffff" stroke="#d69e2e" stroke-width="2" filter="url(#shadow)"/>
  <rect x="370" y="110" width="120" height="4" fill="#d69e2e"/>
  <text x="430" y="137" font-family="Consolas, monospace" font-size="11" font-weight="600" fill="#d69e2e" text-anchor="middle">Parse blocks</text>
  
  <!-- Arrow -->
  <line x1="490" y1="130" x2="525" y2="130" stroke="#4a5568" stroke-width="2"/>
  <polygon points="520,126 530,130 520,134" fill="#4a5568"/>
  
  <!-- Render -->
  <rect x="535" y="110" width="110" height="40" rx="3" fill="#ffffff" stroke="#805ad5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="535" y="110" width="110" height="4" fill="#805ad5"/>
  <text x="590" y="137" font-family="Consolas, monospace" font-size="11" font-weight="600" fill="#805ad5" text-anchor="middle">Render</text>
  
  <!-- Mensaje section -->
  <rect x="60" y="170" width="590" height="55" rx="3" fill="#ffffff" stroke="#a0aec0" stroke-width="1" filter="url(#shadow)"/>
  <text x="80" y="195" font-family="Consolas, monospace" font-size="12" font-weight="600" fill="#2d3748">Mensaje:</text>
  <text x="160" y="195" font-family="Consolas, monospace" font-size="11" fill="#718096">"Las ventas fueron...\n</text>
  <text x="160" y="213" font-family="Consolas, monospace" font-size="11" fill="#e53e3e">```chart-data\n{...}\n```</text>
  <text x="330" y="213" font-family="Consolas, monospace" font-size="11" fill="#718096">"</text>
  
  <!-- Parsed section -->
  <text x="60" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#2d3748">Parsed:</text>
  
  <!-- TextBlock box -->
  <rect x="80" y="270" width="280" height="45" rx="3" fill="#ffffff" stroke="#38a169" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="80" y="270" width="280" height="4" fill="#38a169"/>
  <text x="95" y="295" font-family="Consolas, monospace" font-size="11" fill="#38a169">TextBlock:</text>
  <text x="180" y="295" font-family="Consolas, monospace" font-size="11" fill="#4a5568">"Las ventas fueron..."</text>
  
  <!-- ChartBlock box -->
  <rect x="380" y="270" width="270" height="45" rx="3" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="380" y="270" width="270" height="4" fill="#2b6cb0"/>
  <text x="395" y="295" font-family="Consolas, monospace" font-size="11" fill="#2b6cb0">ChartBlock:</text>
  <text x="485" y="295" font-family="Consolas, monospace" font-size="11" fill="#4a5568">{type: "bar", data: [...]}</text>
  
  <!-- Rendered section -->
  <text x="60" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#2d3748">Rendered:</text>
  
  <!-- Rendered output box -->
  <rect x="80" y="365" width="560" height="125" rx="3" fill="#ffffff" stroke="#805ad5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="365" width="560" height="5" fill="#805ad5"/>
  
  <!-- Text rendered -->
  <text x="100" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2d3748">Las ventas fueron...</text>
  
  <!-- Chart box inside rendered -->
  <rect x="100" y="415" width="280" height="60" rx="2" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="240" y="432" font-family="Consolas, monospace" font-size="10" fill="#718096" text-anchor="middle">BAR CHART</text>
  
  <!-- Better bar chart -->
  <rect x="120" y="440" width="100" height="12" rx="2" fill="#2b6cb0"/>
  <rect x="120" y="456" width="160" height="12" rx="2" fill="#38a169"/>
  
  <!-- Labels for bars -->
  <text x="230" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#718096">Q1: $1.2M</text>
  <text x="290" y="466" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#718096">Q2: $1.8M</text>
  
</svg>
