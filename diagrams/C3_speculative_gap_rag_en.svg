<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.1"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="420" fill="none"/>

  <!-- Header -->
  <rect x="40" y="20" width="620" height="50" rx="0" fill="#1a365d" filter="url(#shadow)"/>
  <text x="350" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">SPECULATIVE GAP RAG (SG-RAG)</text>

  <!-- Main container -->
  <rect x="40" y="85" width="620" height="315" rx="0" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Left side: Traditional RAG -->
  <rect x="60" y="105" width="180" height="180" rx="3" fill="#ffffff" stroke="#a0aec0" stroke-width="1" filter="url(#shadow)"/>
  <text x="150" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#718096" text-anchor="middle">Traditional RAG</text>

  <text x="80" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#4a5568">User asks question</text>
  <text x="80" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#4a5568">System searches chunks</text>
  <text x="80" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#4a5568">Answers or says</text>
  <text x="80" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#e53e3e" font-style="italic">"I don't have that info"</text>

  <text x="150" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#a0aec0" text-anchor="middle">The gap is lost</text>
  <text x="150" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#a0aec0" text-anchor="middle">forever</text>

  <!-- Arrow between -->
  <line x1="260" y1="195" x2="290" y2="195" stroke="#4a5568" stroke-width="2"/>
  <polygon points="285,191 295,195 285,199" fill="#4a5568"/>

  <!-- Right side: SG-RAG -->
  <rect x="310" y="105" width="330" height="275" rx="3" fill="#ffffff" stroke="#2b6cb0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="310" y="105" width="330" height="5" fill="#2b6cb0"/>
  <text x="475" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#2b6cb0" text-anchor="middle">SG-RAG in Lumen</text>

  <!-- Two outcomes side by side -->
  <rect x="330" y="145" width="140" height="55" rx="3" fill="#f0fff4" stroke="#38a169" stroke-width="1"/>
  <text x="400" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#38a169" text-anchor="middle">Info Found</text>
  <text x="400" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Normal response</text>

  <rect x="485" y="145" width="140" height="55" rx="3" fill="#fef3c7" stroke="#d69e2e" stroke-width="1"/>
  <text x="555" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#d69e2e" text-anchor="middle">Gap Detected</text>
  <text x="555" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Missing info</text>

  <!-- What Lumen responds -->
  <rect x="330" y="215" width="295" height="60" rx="3" fill="#edf2f7" stroke="#4a5568" stroke-width="1"/>
  <text x="477" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#2d3748" text-anchor="middle">Response to User</text>
  <text x="477" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#718096" text-anchor="middle" font-style="italic">"That should be in {document/section}"</text>

  <!-- Arrow from Gap to Response -->
  <line x1="555" y1="200" x2="555" y2="213" stroke="#4a5568" stroke-width="1.5"/>
  <polygon points="551,208 555,218 559,208" fill="#4a5568"/>

  <!-- Simultaneous: Gap Memory -->
  <text x="340" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#805ad5" font-weight="600">+ Simultaneously:</text>

  <rect x="330" y="305" width="295" height="55" rx="3" fill="#f5f3ff" stroke="#805ad5" stroke-width="1"/>
  <text x="477" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#805ad5" text-anchor="middle">Gap Memory</text>
  <text x="477" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Persists gap → Prioritizes → Guides what to document</text>

</svg>
