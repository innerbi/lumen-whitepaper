<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" width="750" height="420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.1"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="750" height="420" fill="none"/>

  <!-- Header -->
  <rect x="40" y="25" width="670" height="50" rx="0" fill="#1a365d" filter="url(#shadow)"/>
  <text x="375" y="57" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">HALLUCINATION GUARD PATTERN</text>

  <!-- Main container -->
  <rect x="40" y="90" width="670" height="305" rx="0" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Agent Output box -->
  <rect x="60" y="115" width="130" height="65" rx="3" fill="#ffffff" stroke="#2b6cb0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="115" width="130" height="4" fill="#2b6cb0"/>
  <text x="125" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#2b6cb0" text-anchor="middle">Agent Output</text>
  <text x="125" y="165" font-family="Consolas, monospace" font-size="10" fill="#718096" text-anchor="middle">"Revenue +15%"</text>

  <!-- Arrow to Claim Extractor -->
  <line x1="190" y1="147" x2="225" y2="147" stroke="#4a5568" stroke-width="2"/>
  <polygon points="220,143 230,147 220,151" fill="#4a5568"/>

  <!-- Claim Extractor -->
  <rect x="235" y="115" width="130" height="65" rx="3" fill="#ffffff" stroke="#38a169" stroke-width="2" filter="url(#shadow)"/>
  <rect x="235" y="115" width="130" height="4" fill="#38a169"/>
  <text x="300" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#38a169" text-anchor="middle">Claim Extractor</text>
  <text x="300" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#718096" text-anchor="middle">LLM extracts</text>
  <text x="300" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#718096" text-anchor="middle">factual claims</text>

  <!-- Arrow to Verifier -->
  <line x1="365" y1="147" x2="400" y2="147" stroke="#4a5568" stroke-width="2"/>
  <polygon points="395,143 405,147 395,151" fill="#4a5568"/>

  <!-- Source Verifier -->
  <rect x="410" y="115" width="130" height="65" rx="3" fill="#ffffff" stroke="#2b6cb0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="410" y="115" width="130" height="4" fill="#2b6cb0"/>
  <text x="475" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#2b6cb0" text-anchor="middle">Source Verifier</text>
  <text x="475" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Verify claims vs</text>
  <text x="475" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#718096" text-anchor="middle">base sources</text>

  <!-- Sources box -->
  <rect x="560" y="115" width="130" height="65" rx="3" fill="#ffffff" stroke="#a0aec0" stroke-width="1" stroke-dasharray="4,2" filter="url(#shadow)"/>
  <text x="625" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#718096" text-anchor="middle">RAG Sources</text>
  <text x="625" y="160" font-family="Consolas, monospace" font-size="9" fill="#a0aec0" text-anchor="middle">Documents</text>
  <text x="625" y="174" font-family="Consolas, monospace" font-size="9" fill="#a0aec0" text-anchor="middle">DB Results</text>

  <!-- Arrow from Sources to Verifier -->
  <line x1="560" y1="147" x2="545" y2="147" stroke="#a0aec0" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Decision diamond -->
  <polygon points="475,205 525,245 475,285 425,245" fill="#ffffff" stroke="#2b6cb0" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#2b6cb0" text-anchor="middle">Valid?</text>

  <!-- Arrow down from Verifier to Decision -->
  <line x1="475" y1="180" x2="475" y2="203" stroke="#4a5568" stroke-width="2"/>
  <polygon points="471,198 475,208 479,198" fill="#4a5568"/>

  <!-- YES path -->
  <line x1="525" y1="245" x2="600" y2="245" stroke="#38a169" stroke-width="2"/>
  <line x1="600" y1="245" x2="600" y2="335" stroke="#38a169" stroke-width="2"/>
  <line x1="600" y1="335" x2="430" y2="335" stroke="#38a169" stroke-width="2"/>
  <polygon points="435,331 425,335 435,339" fill="#38a169"/>
  <text x="560" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#38a169">YES</text>

  <!-- Approved Output -->
  <rect x="300" y="305" width="130" height="55" rx="3" fill="#ffffff" stroke="#38a169" stroke-width="2" filter="url(#shadow)"/>
  <rect x="300" y="305" width="130" height="4" fill="#38a169"/>
  <text x="365" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#38a169" text-anchor="middle">Approved</text>
  <text x="365" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Return to user</text>

  <!-- NO path -->
  <line x1="425" y1="245" x2="180" y2="245" stroke="#e53e3e" stroke-width="2"/>
  <line x1="180" y1="245" x2="180" y2="335" stroke="#e53e3e" stroke-width="2"/>
  <polygon points="176,330 180,340 184,330" fill="#e53e3e"/>
  <text x="385" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#e53e3e">NO</text>

  <!-- Rejected box -->
  <rect x="115" y="305" width="130" height="55" rx="3" fill="#ffffff" stroke="#e53e3e" stroke-width="2" filter="url(#shadow)"/>
  <rect x="115" y="305" width="130" height="4" fill="#e53e3e"/>
  <text x="180" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#e53e3e" text-anchor="middle">Rejected</text>
  <text x="180" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Regenerate or flag</text>

  <!-- Stats box -->
  <rect x="60" y="205" width="100" height="50" rx="3" fill="#ffffff" stroke="#a0aec0" stroke-width="1" filter="url(#shadow)"/>
  <text x="110" y="227" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Hallucination:</text>
  <text x="110" y="245" font-family="Consolas, monospace" font-size="12" font-weight="600" fill="#38a169" text-anchor="middle">12% → 0.3%</text>

</svg>
