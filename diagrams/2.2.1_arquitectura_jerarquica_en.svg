<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" width="800" height="570">
  <!-- Background -->
  <rect width="800" height="570" fill="none"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="570" fill="url(#grid)" opacity="0.5"/>

  <!-- Title bar -->
  <rect x="25" y="20" width="750" height="60" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="400" y="57" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">HIERARCHICAL ARCHITECTURE</text>

  <!-- Main container (10px gap below title) -->
  <rect x="25" y="90" width="750" height="460" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- METACOGNITIVE LAYER -->
  <rect x="60" y="110" width="680" height="110" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="400" y="137" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">METACOGNITIVE LAYER</text>

  <circle cx="90" cy="163" r="4" fill="#3b82f6"/>
  <text x="110" y="168" font-family="Arial, sans-serif" font-size="12" fill="#888888">Long-term goal management</text>

  <circle cx="90" cy="188" r="4" fill="#3b82f6"/>
  <text x="110" y="193" font-family="Arial, sans-serif" font-size="12" fill="#888888">Policy selection</text>

  <circle cx="400" cy="163" r="4" fill="#3b82f6"/>
  <text x="420" y="168" font-family="Arial, sans-serif" font-size="12" fill="#888888">High-level learning</text>

  <!-- Arrow 1 -->
  <line x1="400" y1="220" x2="400" y2="240" stroke="#888888" stroke-width="2"/>
  <polygon points="395,240 400,253 405,240" fill="#888888"/>

  <!-- DELIBERATIVE LAYER -->
  <rect x="60" y="260" width="680" height="110" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="400" y="287" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">DELIBERATIVE LAYER</text>

  <circle cx="90" cy="313" r="4" fill="#3b82f6"/>
  <text x="110" y="318" font-family="Arial, sans-serif" font-size="12" fill="#888888">State estimation</text>

  <circle cx="90" cy="338" r="4" fill="#3b82f6"/>
  <text x="110" y="343" font-family="Arial, sans-serif" font-size="12" fill="#888888">Symbolic/numeric planning</text>

  <circle cx="400" cy="313" r="4" fill="#3b82f6"/>
  <text x="420" y="318" font-family="Arial, sans-serif" font-size="12" fill="#888888">Medium-term reasoning</text>

  <!-- Arrow 2 -->
  <line x1="400" y1="370" x2="400" y2="390" stroke="#888888" stroke-width="2"/>
  <polygon points="395,390 400,403 405,390" fill="#888888"/>

  <!-- REACTIVE LAYER -->
  <rect x="60" y="410" width="680" height="100" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="400" y="437" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">REACTIVE LAYER</text>

  <circle cx="90" cy="463" r="4" fill="#3b82f6"/>
  <text x="110" y="468" font-family="Arial, sans-serif" font-size="12" fill="#888888">Real-time control</text>

  <circle cx="90" cy="488" r="4" fill="#3b82f6"/>
  <text x="110" y="493" font-family="Arial, sans-serif" font-size="12" fill="#888888">Reflex responses</text>

  <circle cx="400" cy="463" r="4" fill="#3b82f6"/>
  <text x="420" y="468" font-family="Arial, sans-serif" font-size="12" fill="#888888">Action execution</text>

</svg>
