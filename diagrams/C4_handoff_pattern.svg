<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400" width="750" height="400">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.15"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2b6cb0"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38a169"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="750" height="400" fill="none"/>

  <!-- Header -->
  <rect x="40" y="20" width="670" height="45" rx="0" fill="#1a365d" filter="url(#shadow)"/>
  <text x="375" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">PATRÓN HANDOFF</text>

  <!-- Main container -->
  <rect x="40" y="75" width="670" height="305" rx="0" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- User -->
  <circle cx="100" cy="180" r="25" fill="#e2e8f0" stroke="#4a5568" stroke-width="2"/>
  <text x="100" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#4a5568" text-anchor="middle">User</text>

  <!-- GeneralAgent box -->
  <rect x="180" y="140" width="140" height="80" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="180" y="140" width="140" height="6" fill="#1a1a1a"/>
  <text x="250" y="175" font-family="Consolas, monospace" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle">GeneralAgent</text>
  <text x="250" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#718096" text-anchor="middle">Detecta: "requiere DAX"</text>
  <text x="250" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#e53e3e" text-anchor="middle">→ trigger handoff</text>

  <!-- Handoff arrow -->
  <line x1="320" y1="180" x2="400" y2="180" stroke="#2b6cb0" stroke-width="3" marker-end="url(#arrowhead)"/>
  <rect x="330" y="155" width="60" height="20" fill="#f7fafc"/>
  <text x="360" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#2b6cb0" text-anchor="middle">HANDOFF</text>

  <!-- DAXAgent box -->
  <rect x="410" y="140" width="140" height="80" rx="4" fill="#ffffff" stroke="#38a169" stroke-width="2" filter="url(#shadow)"/>
  <rect x="410" y="140" width="140" height="6" fill="#38a169"/>
  <text x="480" y="175" font-family="Consolas, monospace" font-size="12" font-weight="600" fill="#38a169" text-anchor="middle">DAXAgent</text>
  <text x="480" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#718096" text-anchor="middle">Expertise: DAX queries</text>
  <text x="480" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#718096" text-anchor="middle">Control total</text>

  <!-- Result arrow back -->
  <path d="M 480 220 L 480 260 L 250 260 L 250 220" stroke="#38a169" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)"/>
  <rect x="330" y="248" width="60" height="20" fill="#f7fafc"/>
  <text x="360" y="263" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#38a169" text-anchor="middle">Result</text>

  <!-- User to GeneralAgent -->
  <line x1="125" y1="180" x2="175" y2="180" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- External service -->
  <rect x="590" y="150" width="100" height="60" rx="4" fill="#f1f8e9" stroke="#33691e" stroke-width="1.5"/>
  <text x="640" y="175" font-family="Consolas, monospace" font-size="10" font-weight="600" fill="#33691e" text-anchor="middle">Power BI</text>
  <text x="640" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#4a5568" text-anchor="middle">Execute DAX</text>

  <!-- DAX to Power BI -->
  <line x1="550" y1="180" x2="585" y2="180" stroke="#a0aec0" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Handoff tuple description -->
  <rect x="60" y="290" width="300" height="75" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="75" y="310" font-family="Consolas, monospace" font-size="10" font-weight="600" fill="#1a365d">Handoff = (trigger, target, context, query)</text>
  <text x="75" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#4a5568">• trigger: "requiere ejecución DAX"</text>
  <text x="75" y="343" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#4a5568">• target: DAXAgent</text>
  <text x="75" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#4a5568">• context: historial conversación + metadata</text>

  <!-- Key difference -->
  <rect x="380" y="290" width="310" height="75" rx="3" fill="#fff5f5" stroke="#e53e3e" stroke-width="1"/>
  <text x="395" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#e53e3e">Diferencia vs Agent-as-Tool:</text>
  <text x="395" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#4a5568">• Transferencia COMPLETA del control</text>
  <text x="395" y="343" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#4a5568">• Agente origen no interviene más</text>
  <text x="395" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#4a5568">• Resultado va directo al usuario</text>
</svg>
