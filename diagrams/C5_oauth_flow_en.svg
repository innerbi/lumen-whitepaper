<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.1"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="700" height="520" fill="none"/>
  
  <rect x="40" y="25" width="620" height="50" rx="0" fill="#1a365d" filter="url(#shadow)"/>
  <text x="350" y="57" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">OAUTH FLOW IN LUMEN</text>
  
  <rect x="40" y="90" width="620" height="400" rx="0" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Step 1 -->
  <text x="60" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2b6cb0" font-weight="600">1.</text>
  <text x="85" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2d3748">User accesses Lumen</text>
  
  <line x1="85" y1="145" x2="85" y2="165" stroke="#2b6cb0" stroke-width="1.5"/>
  <polygon points="81,160 85,170 89,160" fill="#2b6cb0"/>
  
  <!-- Step 2 -->
  <text x="60" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2b6cb0" font-weight="600">2.</text>
  <text x="85" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2d3748">Redirect a Microsoft login</text>
  <text x="315" y="190" font-family="Consolas, monospace" font-size="12" fill="#718096">(OIDC)</text>
  
  <line x1="85" y1="205" x2="85" y2="225" stroke="#2b6cb0" stroke-width="1.5"/>
  <polygon points="81,220 85,230 89,220" fill="#2b6cb0"/>
  
  <!-- Step 3 -->
  <text x="60" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2b6cb0" font-weight="600">3.</text>
  <text x="85" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2d3748">User authorizes scopes</text>
  <text x="280" y="250" font-family="Consolas, monospace" font-size="12" fill="#718096">(Power BI, Fabric)</text>
  
  <line x1="85" y1="265" x2="85" y2="285" stroke="#2b6cb0" stroke-width="1.5"/>
  <polygon points="81,280 85,290 89,280" fill="#2b6cb0"/>
  
  <!-- Step 4 -->
  <text x="60" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2b6cb0" font-weight="600">4.</text>
  <text x="85" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2d3748">Callback con authorization code</text>
  
  <line x1="85" y1="325" x2="85" y2="345" stroke="#2b6cb0" stroke-width="1.5"/>
  <polygon points="81,340 85,350 89,340" fill="#2b6cb0"/>
  
  <!-- Step 5 -->
  <text x="60" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2b6cb0" font-weight="600">5.</text>
  <text x="85" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2d3748">Exchange for</text>
  <text x="200" y="370" font-family="Consolas, monospace" font-size="12" fill="#38a169">access_token</text>
  <text x="310" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2d3748">+</text>
  <text x="330" y="370" font-family="Consolas, monospace" font-size="12" fill="#38a169">refresh_token</text>
  
  <line x1="85" y1="385" x2="85" y2="405" stroke="#2b6cb0" stroke-width="1.5"/>
  <polygon points="81,400 85,410 89,400" fill="#2b6cb0"/>
  
  <!-- Step 6 -->
  <text x="60" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2b6cb0" font-weight="600">6.</text>
  <text x="85" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2d3748">Tokens stored per session</text>
  <text x="340" y="430" font-family="Consolas, monospace" font-size="12" fill="#718096">(encrypted)</text>
  
  <line x1="85" y1="445" x2="85" y2="465" stroke="#2b6cb0" stroke-width="1.5"/>
  <polygon points="81,460 85,470 89,460" fill="#2b6cb0"/>
  
  <!-- Step 7 -->
  <rect x="55" y="475" width="400" height="30" rx="2" fill="#ebf8ff" stroke="#bee3f8" stroke-width="1"/>
  <text x="65" y="495" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2b6cb0" font-weight="600">7.</text>
  <text x="90" y="495" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2b6cb0">Agents use tokens for APIs</text>
  
</svg>
