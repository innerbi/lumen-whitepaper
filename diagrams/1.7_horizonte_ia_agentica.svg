<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#000" flood-opacity="0.4"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="500" fill="none"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="500" fill="url(#grid)" opacity="0.5"/>

  <!-- Title bar -->
  <rect x="25" y="20" width="850" height="60" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="450" y="57" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">HORIZONTE DE IA AGÉNTICA</text>

  <!-- Main container (10px gap below title) -->
  <rect x="25" y="90" width="850" height="390" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- Main timeline line -->
  <line x1="100" y1="180" x2="800" y2="180" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- Timeline nodes -->
  <!-- 2025 -->
  <circle cx="150" cy="180" r="12" fill="#333333" stroke="#4a4a4a" stroke-width="2"/>
  <circle cx="150" cy="180" r="5" fill="#666666"/>
  
  <!-- 2027 -->
  <circle cx="350" cy="180" r="12" fill="#333333" stroke="#4a4a4a" stroke-width="2"/>
  <circle cx="350" cy="180" r="5" fill="#666666"/>
  
  <!-- 2029 -->
  <circle cx="550" cy="180" r="12" fill="#333333" stroke="#4a4a4a" stroke-width="2"/>
  <circle cx="550" cy="180" r="5" fill="#666666"/>
  
  <!-- 2030+ -->
  <circle cx="750" cy="180" r="12" fill="#333333" stroke="#4a4a4a" stroke-width="2"/>
  <circle cx="750" cy="180" r="5" fill="#666666"/>
  
  <!-- Year labels -->
  <text x="150" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2025</text>
  <text x="350" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2027</text>
  <text x="550" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2029</text>
  <text x="750" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2030+</text>
  
  <!-- Cards -->
  <!-- 2025 Card -->
  <rect x="75" y="210" width="150" height="100" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" filter="url(#shadow)"/>
  <text x="150" y="250" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">25%</text>
  <text x="150" y="280" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Automatización</text>
  <text x="150" y="298" font-family="Arial, sans-serif" font-size="11" fill="#4a4a4a" text-anchor="middle">Pilots</text>
  
  <!-- 2027 Card -->
  <rect x="275" y="210" width="150" height="100" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" filter="url(#shadow)"/>
  <text x="350" y="250" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">50%</text>
  <text x="350" y="280" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Automatización</text>
  <text x="350" y="298" font-family="Arial, sans-serif" font-size="11" fill="#4a4a4a" text-anchor="middle">Production</text>
  
  <!-- 2029 Card -->
  <rect x="475" y="210" width="150" height="100" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" filter="url(#shadow)"/>
  <text x="550" y="250" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">80%</text>
  <text x="550" y="280" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Automatización</text>
  <text x="550" y="298" font-family="Arial, sans-serif" font-size="11" fill="#4a4a4a" text-anchor="middle">Auto</text>
  
  <!-- 2030+ Card -->
  <rect x="675" y="210" width="150" height="100" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" filter="url(#shadow)"/>
  <text x="750" y="250" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#3b82f6" text-anchor="middle">90%+</text>
  <text x="750" y="280" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Automatización</text>
  <text x="750" y="298" font-family="Arial, sans-serif" font-size="11" fill="#4a4a4a" text-anchor="middle">Full Auto</text>
  
  <!-- Bottom flow -->
  <rect x="50" y="380" width="800" height="80" rx="6" fill="#0d0d0d" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Flow arrows and labels -->
  <text x="130" y="415" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#888888" text-anchor="middle">Pilotos</text>
  <text x="130" y="435" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#888888" text-anchor="middle">agénticos</text>
  
  <polygon points="200,420 210,415 210,425" fill="#333333"/>
  <line x1="210" y1="420" x2="250" y2="420" stroke="#333333" stroke-width="2"/>
  
  <text x="330" y="415" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#888888" text-anchor="middle">Producción</text>
  <text x="330" y="435" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#888888" text-anchor="middle">multi-agente</text>
  
  <polygon points="410,420 420,415 420,425" fill="#333333"/>
  <line x1="420" y1="420" x2="460" y2="420" stroke="#333333" stroke-width="2"/>
  
  <text x="545" y="415" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#888888" text-anchor="middle">Automatización</text>
  <text x="545" y="435" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#888888" text-anchor="middle">de workflows</text>
  
  <polygon points="635,420 645,415 645,425" fill="#333333"/>
  <line x1="645" y1="420" x2="685" y2="420" stroke="#333333" stroke-width="2"/>
  
  <text x="770" y="415" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#888888" text-anchor="middle">Autonomía</text>
  <text x="770" y="435" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#3b82f6" text-anchor="middle">empresarial</text>
  
</svg>
