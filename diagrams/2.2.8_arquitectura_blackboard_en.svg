<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="530" fill="none"/>
  <rect width="800" height="530" fill="url(#grid)" opacity="0.4"/>

  <!-- Title bar -->
  <rect x="25" y="20" width="750" height="60" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="400" y="57" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">BLACKBOARD ARCHITECTURE</text>

  <!-- Main container (10px gap below title) -->
  <rect x="25" y="90" width="750" height="420" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Agents row -->
  <!-- Agent A -->
  <rect x="55" y="125" width="130" height="55" rx="8" fill="#141414" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)"/>
  <text x="120" y="160" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>

  <!-- Agent B -->
  <rect x="205" y="125" width="130" height="55" rx="8" fill="#141414" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)"/>
  <text x="270" y="160" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>

  <!-- Agent C -->
  <rect x="355" y="125" width="130" height="55" rx="8" fill="#141414" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)"/>
  <text x="420" y="160" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>

  <!-- Agent D -->
  <rect x="505" y="125" width="130" height="55" rx="8" fill="#141414" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)"/>
  <text x="570" y="160" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">D</text>

  <!-- Connection lines with bidirectional arrows -->
  <!-- Agent A connection -->
  <line x1="120" y1="180" x2="120" y2="215" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <line x1="120" y1="255" x2="120" y2="290" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <polygon points="117,187 120,180 123,187" fill="#ffffff"/>
  <polygon points="117,283 120,295 123,283" fill="#ffffff"/>
  <rect x="90" y="215" width="60" height="40" rx="4" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
  <text x="120" y="232" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">Read/</text>
  <text x="120" y="247" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">Write</text>

  <!-- Agent B connection -->
  <line x1="270" y1="180" x2="270" y2="215" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <line x1="270" y1="255" x2="270" y2="290" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <polygon points="267,187 270,180 273,187" fill="#ffffff"/>
  <polygon points="267,283 270,295 273,283" fill="#ffffff"/>
  <rect x="240" y="215" width="60" height="40" rx="4" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
  <text x="270" y="232" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">Read/</text>
  <text x="270" y="247" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">Write</text>

  <!-- Agent C connection -->
  <line x1="420" y1="180" x2="420" y2="215" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <line x1="420" y1="255" x2="420" y2="290" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <polygon points="417,187 420,180 423,187" fill="#ffffff"/>
  <polygon points="417,283 420,295 423,283" fill="#ffffff"/>
  <rect x="390" y="215" width="60" height="40" rx="4" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
  <text x="420" y="232" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">Read/</text>
  <text x="420" y="247" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">Write</text>

  <!-- Agent D connection -->
  <line x1="570" y1="180" x2="570" y2="215" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <line x1="570" y1="255" x2="570" y2="290" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <polygon points="567,187 570,180 573,187" fill="#ffffff"/>
  <polygon points="567,283 570,295 573,283" fill="#ffffff"/>
  <rect x="540" y="215" width="60" height="40" rx="4" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
  <text x="570" y="232" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">Read/</text>
  <text x="570" y="247" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">Write</text>

  <!-- Blackboard main box -->
  <rect x="50" y="300" width="700" height="165" rx="8" fill="#0d1117" stroke="#444444" stroke-width="1"/>

  <!-- Blackboard header - full width -->
  <rect x="50" y="300" width="700" height="45" rx="8" fill="#1a2332"/>
  <rect x="50" y="335" width="700" height="10" fill="#1a2332"/>
  <text x="400" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3b82f6" text-anchor="middle">SHARED STATE</text>

  <!-- Blackboard content -->
  <circle cx="80" cy="370" r="4" fill="#3b82f6"/>
  <text x="95" y="375" font-family="Arial, sans-serif" font-size="13" fill="#888888">Intermediate results</text>

  <circle cx="80" cy="405" r="4" fill="#3b82f6"/>
  <text x="95" y="410" font-family="Arial, sans-serif" font-size="13" fill="#888888">Hypotheses</text>

  <circle cx="80" cy="440" r="4" fill="#3b82f6"/>
  <text x="95" y="445" font-family="Arial, sans-serif" font-size="13" fill="#888888">Messages between agents</text>

  <!-- Small decorative elements -->
  <circle cx="700" cy="370" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="720" cy="370" r="3" fill="#3b82f6" opacity="0.5"/>
  <circle cx="700" cy="405" r="3" fill="#3b82f6" opacity="0.4"/>
  <circle cx="720" cy="405" r="3" fill="#3b82f6" opacity="0.6"/>
  <circle cx="700" cy="440" r="3" fill="#3b82f6" opacity="0.5"/>
  <circle cx="720" cy="440" r="3" fill="#3b82f6" opacity="0.3"/>

</svg>
