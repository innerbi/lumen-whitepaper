<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" width="750" height="420">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <marker id="arrowhead" markerWidth="5" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 5 2, 0 4" fill="#888888"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="5" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 5 2, 0 4" fill="#3b82f6"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="5" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 5 2, 0 4" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="750" height="420" fill="none"/>
  <rect width="750" height="420" fill="url(#grid)" opacity="0.5"/>

  <!-- Title bar -->
  <rect x="25" y="20" width="700" height="60" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="375" y="57" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3b82f6" text-anchor="middle" letter-spacing="2">EVOLUTION: STATIC → PLASTIC</text>

  <!-- Main container -->
  <rect x="25" y="90" width="700" height="310" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Left side: STATIC SYSTEM -->
  <rect x="50" y="110" width="280" height="180" rx="4" fill="#1a1a1a" stroke="#888888" stroke-width="1"/>
  <text x="190" y="132" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#888888" text-anchor="middle">STATIC SYSTEM</text>

  <!-- Static graph -->
  <!-- Node A -->
  <circle cx="110" cy="165" r="18" fill="#1a1a1a" stroke="#888888" stroke-width="2"/>
  <text x="110" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>

  <!-- Node B -->
  <circle cx="230" cy="165" r="18" fill="#1a1a1a" stroke="#888888" stroke-width="2"/>
  <text x="230" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>

  <!-- Node C -->
  <circle cx="110" cy="245" r="18" fill="#1a1a1a" stroke="#888888" stroke-width="2"/>
  <text x="110" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>

  <!-- Node D -->
  <circle cx="230" cy="245" r="18" fill="#1a1a1a" stroke="#888888" stroke-width="2"/>
  <text x="230" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">D</text>

  <!-- Static edges (simple lines) -->
  <line x1="128" y1="165" x2="207" y2="165" stroke="#888888" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="110" y1="183" x2="110" y2="222" stroke="#888888" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="230" y1="183" x2="230" y2="222" stroke="#888888" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="128" y1="245" x2="207" y2="245" stroke="#888888" stroke-width="1" marker-end="url(#arrowhead)"/>

  <!-- Arrow in center -->
  <line x1="345" y1="205" x2="395" y2="205" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead-green)"/>

  <!-- Right side: PEMA SYSTEM -->
  <rect x="420" y="110" width="280" height="180" rx="4" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
  <text x="560" y="132" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#3b82f6" text-anchor="middle">PEMA SYSTEM</text>

  <!-- PEMA graph -->
  <!-- Node A -->
  <circle cx="480" cy="165" r="18" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
  <text x="480" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>

  <!-- Node B -->
  <circle cx="600" cy="165" r="18" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>

  <!-- Node C -->
  <circle cx="480" cy="245" r="18" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
  <text x="480" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>

  <!-- Node D -->
  <circle cx="600" cy="245" r="18" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">D</text>

  <!-- PEMA edges (weighted, thicker = stronger) -->
  <line x1="498" y1="165" x2="577" y2="165" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="540" y="155" font-family="Arial, sans-serif" font-size="10" fill="#22c55e" text-anchor="middle">0.8</text>

  <line x1="480" y1="183" x2="480" y2="222" stroke="#888888" stroke-width="1" marker-end="url(#arrowhead)"/>
  <text x="465" y="205" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">0.3</text>

  <line x1="600" y1="183" x2="600" y2="222" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="615" y="205" font-family="Arial, sans-serif" font-size="10" fill="#22c55e" text-anchor="middle">0.9</text>

  <line x1="498" y1="245" x2="577" y2="245" stroke="#888888" stroke-width="1" marker-end="url(#arrowhead)"/>
  <text x="540" y="258" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">0.6</text>

  <!-- Comparison points -->
  <rect x="50" y="305" width="280" height="80" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="70" cy="328" r="4" fill="#888888"/>
  <text x="85" y="332" font-family="Arial, sans-serif" font-size="11" fill="#888888">Fixed weights (0 or 1)</text>
  <circle cx="70" cy="350" r="4" fill="#888888"/>
  <text x="85" y="354" font-family="Arial, sans-serif" font-size="11" fill="#888888">No learning</text>
  <circle cx="70" cy="372" r="4" fill="#888888"/>
  <text x="85" y="376" font-family="Arial, sans-serif" font-size="11" fill="#888888">Immutable topology</text>

  <rect x="420" y="305" width="280" height="80" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="440" cy="328" r="4" fill="#22c55e"/>
  <text x="455" y="332" font-family="Arial, sans-serif" font-size="11" fill="#22c55e">Continuous weights [0,1]</text>
  <circle cx="440" cy="350" r="4" fill="#22c55e"/>
  <text x="455" y="354" font-family="Arial, sans-serif" font-size="11" fill="#22c55e">Hebbian learning</text>
  <circle cx="440" cy="372" r="4" fill="#22c55e"/>
  <text x="455" y="376" font-family="Arial, sans-serif" font-size="11" fill="#22c55e">Neurogenesis and pruning</text>

</svg>
