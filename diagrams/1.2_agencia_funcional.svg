<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 690" width="800" height="690">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#000" flood-opacity="0.4"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="690" fill="none"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="690" fill="url(#grid)" opacity="0.5"/>

  <!-- Title bar -->
  <rect x="40" y="30" width="720" height="60" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="400" y="67" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">AGENCIA FUNCIONAL</text>

  <!-- Main container (10px gap below title) -->
  <rect x="40" y="100" width="720" height="550" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- AGENTE container -->
  <rect x="80" y="120" width="640" height="280" rx="4" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="400" y="155" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#888888" text-anchor="middle" letter-spacing="2">AGENTE</text>

  <!-- Modelo de Resultados box -->
  <rect x="200" y="175" width="400" height="100" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="400" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Modelo de Resultados</text>
  <text x="400" y="240" font-family="Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">Acción A → Consecuencia X</text>
  <text x="400" y="263" font-family="Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">Acción B → Consecuencia Y</text>

  <!-- Arrow down from Modelo to Seleccion -->
  <line x1="400" y1="275" x2="400" y2="305" stroke="#333333" stroke-width="1.5"/>
  <polygon points="395,305 400,315 405,305" fill="#333333"/>

  <!-- Seleccion de Accion box -->
  <rect x="300" y="320" width="200" height="60" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="400" y="347" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">Selección de</text>
  <text x="400" y="370" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">ACCIÓN</text>

  <!-- Arrow down from Seleccion to ENTORNO -->
  <line x1="400" y1="380" x2="400" y2="445" stroke="#333333" stroke-width="1.5"/>
  <polygon points="395,445 400,455 405,445" fill="#333333"/>

  <!-- ENTORNO container -->
  <rect x="80" y="465" width="640" height="80" rx="4" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="400" y="495" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#888888" text-anchor="middle" letter-spacing="2">ENTORNO</text>
  <text x="400" y="525" font-family="Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">Ejecución de Acción → Observación de Resultado → Feedback</text>

  <!-- Feedback loop - down from ENTORNO -->
  <line x1="400" y1="545" x2="400" y2="585" stroke="#333333" stroke-width="1.5"/>

  <!-- Actualizacion del modelo box -->
  <rect x="300" y="585" width="250" height="40" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="425" y="612" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">Actualización del modelo</text>

  <!-- Arrow right from Actualizacion -->
  <line x1="550" y1="605" x2="730" y2="605" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Feedback loop - right side going up -->
  <line x1="730" y1="605" x2="730" y2="225" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="730" y1="225" x2="600" y2="225" stroke="#3b82f6" stroke-width="1.5"/>
  <polygon points="605,220 595,225 605,230" fill="#3b82f6"/>

</svg>
