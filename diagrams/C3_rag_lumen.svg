<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.1"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadowDeep" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset dx="2" dy="2" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.15"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="520" fill="none"/>
  
  <!-- Header -->
  <rect x="40" y="25" width="620" height="50" rx="0" fill="#1a365d" filter="url(#shadow)"/>
  <text x="350" y="57" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">RAG EN LUMEN</text>
  
  <!-- Main container -->
  <rect x="40" y="90" width="620" height="400" rx="0" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- User query -->
  <text x="60" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d3748">Usuario:</text>
  <text x="120" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5568" font-style="italic">"Según el manual, como se calcula el margen?"</text>
  
  <!-- Arrow down to GeneralAgent -->
  <line x1="180" y1="140" x2="180" y2="165" stroke="#2b6cb0" stroke-width="1.5"/>
  <polygon points="176,160 180,170 184,160" fill="#2b6cb0"/>
  
  <!-- GeneralAgent - Main large box -->
  <rect x="60" y="175" width="400" height="290" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="175" width="400" height="6" fill="#1a1a1a"/>
  <text x="120" y="212" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#1a1a1a">GeneralAgent</text>
  
  <!-- Step 1 inside GeneralAgent -->
  <text x="80" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4a5568">1. Detecta: necesita buscar en documentos</text>
  
  <!-- Step 2 - invoke tool -->
  <text x="80" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4a5568">2. Invoca tool:</text>
  <text x="100" y="330" font-family="Consolas, monospace" font-size="12" fill="#2b6cb0">DocumentAgent.as_tool("calculo margen")</text>
  
  <!-- Single connector to DocumentAgent - line with large circle on DocumentAgent side -->
  <line x1="360" y1="345" x2="440" y2="345" stroke="#38a169" stroke-width="2"/>
  <circle cx="440" cy="345" r="10" fill="#38a169"/>
  
  <!-- Step 3 - receives chunks -->
  <text x="80" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4a5568">3. Recibe chunks relevantes</text>
  
  <!-- Step 4 - synthesize -->
  <text x="80" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4a5568">4. Sintetiza respuesta usando chunks</text>
  <text x="100" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4a5568">como contexto</text>
  
  <!-- DocumentAgent Tool box - minimal overlap (10px) in bottom right, moved down 15px -->
  <rect x="450" y="295" width="200" height="175" rx="3" fill="#ffffff" stroke="#38a169" stroke-width="2" filter="url(#shadowDeep)"/>
  <rect x="450" y="295" width="200" height="6" fill="#38a169"/>
  <text x="550" y="333" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#38a169" text-anchor="middle">DocumentAgent</text>
  <text x="470" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#718096" font-style="italic">Tool invocado</text>
  
  <text x="470" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5568">• Genera embedding</text>
  <text x="470" y="425" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5568">• Hybrid search Weaviate</text>
  <text x="470" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5568">• Retorna top chunks</text>
  
</svg>
