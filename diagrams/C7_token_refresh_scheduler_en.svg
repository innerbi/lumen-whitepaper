<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.1"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="520" fill="none"/>

  <!-- Header -->
  <rect x="40" y="15" width="520" height="45" rx="0" fill="#1a365d" filter="url(#shadow)"/>
  <text x="300" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="1">TOKEN REFRESH SCHEDULER</text>

  <!-- Step 1: Startup -->
  <rect x="180" y="80" width="240" height="50" rx="4" fill="#2b6cb0" filter="url(#shadow)"/>
  <text x="300" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">STARTUP</text>
  <text x="300" y="118" font-family="Consolas, monospace" font-size="11" fill="#bee3f8" text-anchor="middle">recover_scheduled_refreshes()</text>

  <!-- Arrow down -->
  <line x1="300" y1="130" x2="300" y2="150" stroke="#4a5568" stroke-width="2"/>
  <polygon points="295,145 300,155 305,145" fill="#4a5568"/>

  <!-- Step 2: Read DB -->
  <rect x="150" y="155" width="300" height="35" rx="4" fill="#edf2f7" stroke="#4a5568" stroke-width="1"/>
  <text x="300" y="178" font-family="Consolas, monospace" font-size="12" fill="#2d3748" text-anchor="middle">DB: SELECT tokens WHERE expires_at > NOW()</text>

  <!-- Arrow down -->
  <line x1="300" y1="190" x2="300" y2="210" stroke="#4a5568" stroke-width="2"/>
  <polygon points="295,205 300,215 305,205" fill="#4a5568"/>

  <!-- Step 3: Schedule -->
  <rect x="160" y="215" width="280" height="45" rx="4" fill="#805ad5" filter="url(#shadow)"/>
  <text x="300" y="235" font-family="Consolas, monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">schedule_refresh(session_id, expires_at)</text>
  <text x="300" y="252" font-family="Consolas, monospace" font-size="10" fill="#e9d8fd" text-anchor="middle">delay = expires_at - now - 5min</text>

  <!-- Arrow down -->
  <line x1="300" y1="260" x2="300" y2="280" stroke="#4a5568" stroke-width="2"/>
  <polygon points="295,275 300,285 305,275" fill="#4a5568"/>

  <!-- Step 4: Task sleeping -->
  <rect x="180" y="285" width="240" height="40" rx="4" fill="#faf5ff" stroke="#805ad5" stroke-width="2"/>
  <text x="300" y="305" font-family="Consolas, monospace" font-size="12" fill="#553c9a" text-anchor="middle">asyncio.Task</text>
  <text x="300" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#805ad5" text-anchor="middle">sleeps until 5 min before expiry</text>

  <!-- Arrow down with time indicator -->
  <line x1="300" y1="325" x2="300" y2="355" stroke="#4a5568" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="320" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#718096" font-style="italic">time passes...</text>
  <polygon points="295,350 300,360 305,350" fill="#4a5568"/>

  <!-- Step 5: Execute refresh -->
  <rect x="180" y="360" width="240" height="35" rx="4" fill="#d69e2e" filter="url(#shadow)"/>
  <text x="300" y="383" font-family="Consolas, monospace" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">oauth_service.refresh()</text>

  <!-- Branch point -->
  <line x1="300" y1="395" x2="300" y2="415" stroke="#4a5568" stroke-width="2"/>

  <!-- Horizontal split -->
  <line x1="180" y1="415" x2="420" y2="415" stroke="#4a5568" stroke-width="2"/>

  <!-- Left branch: SUCCESS -->
  <line x1="180" y1="415" x2="180" y2="435" stroke="#38a169" stroke-width="2"/>
  <polygon points="175,430 180,440 185,430" fill="#38a169"/>

  <rect x="100" y="445" width="160" height="55" rx="4" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="180" y="465" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#276749" text-anchor="middle">SUCCESS</text>
  <text x="180" y="482" font-family="Consolas, monospace" font-size="10" fill="#38a169" text-anchor="middle">new expires_in</text>
  <text x="180" y="495" font-family="Consolas, monospace" font-size="10" fill="#38a169" text-anchor="middle">→ schedule_refresh()</text>

  <!-- Right branch: FAIL -->
  <line x1="420" y1="415" x2="420" y2="435" stroke="#e53e3e" stroke-width="2"/>
  <polygon points="415,430 420,440 425,430" fill="#e53e3e"/>

  <rect x="340" y="445" width="160" height="55" rx="4" fill="#fed7d7" stroke="#e53e3e" stroke-width="2"/>
  <text x="420" y="465" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#c53030" text-anchor="middle">FAIL</text>
  <text x="420" y="482" font-family="Consolas, monospace" font-size="10" fill="#e53e3e" text-anchor="middle">retry in 1 min</text>
  <text x="420" y="495" font-family="Consolas, monospace" font-size="10" fill="#e53e3e" text-anchor="middle">→ schedule_refresh()</text>

  <!-- Loop back arrow from SUCCESS -->
  <path d="M 100 472 Q 60 472 60 350 Q 60 240 160 240"
        fill="none" stroke="#38a169" stroke-width="1.5" stroke-dasharray="4,2"/>
  <polygon points="155,235 165,240 155,245" fill="#38a169"/>

  <!-- Loop back arrow from FAIL -->
  <path d="M 500 472 Q 540 472 540 350 Q 540 240 440 240"
        fill="none" stroke="#e53e3e" stroke-width="1.5" stroke-dasharray="4,2"/>
  <polygon points="445,235 435,240 445,245" fill="#e53e3e"/>

  <!-- Labels for loops -->
  <text x="45" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#38a169" transform="rotate(-90, 45, 355)">reschedule</text>
  <text x="555" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#e53e3e" transform="rotate(90, 555, 355)">retry</text>

</svg>
