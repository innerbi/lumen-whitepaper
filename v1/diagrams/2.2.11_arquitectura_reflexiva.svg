<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888888"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="530" fill="none"/>
  <rect width="800" height="530" fill="url(#grid)" opacity="0.5"/>

  <!-- Title bar -->
  <rect x="25" y="20" width="750" height="60" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="400" y="57" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">ARQUITECTURA REFLEXIVA</text>

  <!-- Main container (10px gap below title) -->
  <rect x="25" y="90" width="750" height="420" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Actor Agent -->
  <rect x="110" y="115" width="140" height="55" rx="4" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
  <text x="180" y="143" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3b82f6" text-anchor="middle">ACTOR</text>
  <text x="180" y="160" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3b82f6" text-anchor="middle">Agent</text>

  <!-- Arrow to Evaluator -->
  <line x1="250" y1="142" x2="320" y2="142" stroke="#888888" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Evaluator Agent -->
  <rect x="330" y="115" width="140" height="55" rx="4" fill="#1a1a1a" stroke="#22c55e" stroke-width="2"/>
  <text x="400" y="143" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#22c55e" text-anchor="middle">EVALUATOR</text>
  <text x="400" y="160" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#22c55e" text-anchor="middle">Agent</text>

  <!-- Arrow to Refiner -->
  <line x1="470" y1="142" x2="540" y2="142" stroke="#888888" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Refiner Agent -->
  <rect x="550" y="115" width="140" height="55" rx="4" fill="#1a1a1a" stroke="#ffffff" stroke-width="1"/>
  <text x="620" y="143" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">REFINER</text>
  <text x="620" y="160" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Agent</text>

  <!-- Lines down from agents -->
  <line x1="180" y1="170" x2="180" y2="330" stroke="#888888" stroke-width="1"/>
  <line x1="400" y1="170" x2="400" y2="200" stroke="#888888" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="620" y1="170" x2="620" y2="200" stroke="#888888" stroke-width="1"/>

  <!-- Reflection Memory -->
  <rect x="330" y="210" width="140" height="55" rx="4" fill="#1a1a1a" stroke="#ffffff" stroke-width="1"/>
  <text x="400" y="238" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">REFLECTION</text>
  <text x="400" y="255" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">MEMORY</text>

  <!-- Arrow from Refiner to Memory -->
  <line x1="620" y1="200" x2="620" y2="237" stroke="#888888" stroke-width="1"/>
  <line x1="620" y1="237" x2="470" y2="237" stroke="#888888" stroke-width="1" marker-end="url(#arrowhead)"/>

  <!-- Line from memory down -->
  <line x1="400" y1="265" x2="400" y2="330" stroke="#888888" stroke-width="1"/>

  <!-- Arrows down to final box -->
  <polygon points="176,325 180,335 184,325" fill="#888888"/>
  <polygon points="396,325 400,335 404,325" fill="#888888"/>

  <!-- Improved Response Generator -->
  <rect x="90" y="340" width="620" height="120" rx="4" fill="#1a1a1a" stroke="#ffffff" stroke-width="1"/>
  <text x="400" y="375" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">IMPROVED RESPONSE GENERATOR</text>

  <circle cx="120" cy="410" r="4" fill="#3b82f6"/>
  <text x="135" y="415" font-family="Arial, sans-serif" font-size="12" fill="#888888">Incorpora feedback del evaluador</text>

  <circle cx="120" cy="435" r="4" fill="#22c55e"/>
  <text x="135" y="440" font-family="Arial, sans-serif" font-size="12" fill="#888888">Aplica refinamientos del refiner</text>

  <circle cx="450" cy="410" r="4" fill="#3b82f6"/>
  <text x="465" y="415" font-family="Arial, sans-serif" font-size="12" fill="#888888">Consulta memoria reflexiva para patrones</text>

</svg>
