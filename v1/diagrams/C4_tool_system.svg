<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 500" width="750" height="500">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.1"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowblue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2b6cb0"/>
    </marker>
    <marker id="arrowgray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="750" height="500" fill="none"/>

  <!-- Header -->
  <rect x="40" y="20" width="670" height="50" rx="0" fill="#1a365d" filter="url(#shadow)"/>
  <text x="375" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">SISTEMA DE TOOLS</text>

  <!-- Main container -->
  <rect x="40" y="85" width="670" height="395" rx="0" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Tool Definition Box (Left) -->
  <rect x="55" y="110" width="200" height="170" rx="3" fill="#ffffff" stroke="#3182ce" stroke-width="2" filter="url(#shadow)"/>
  <rect x="55" y="110" width="200" height="5" fill="#3182ce"/>
  <text x="155" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#3182ce" text-anchor="middle">TOOL DEFINITION</text>

  <text x="70" y="165" font-family="Consolas, monospace" font-size="11" fill="#805ad5">@ai_function</text>
  <text x="70" y="185" font-family="Consolas, monospace" font-size="11" fill="#2d3748">def execute_dax(...):</text>

  <line x1="65" y1="198" x2="245" y2="198" stroke="#e2e8f0" stroke-width="1"/>

  <text x="70" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#718096">Docstring:</text>
  <text x="70" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4a5568">"Ejecuta consulta DAX...</text>
  <text x="70" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4a5568">cuando el usuario pide datos"</text>

  <text x="70" y="272" font-family="Consolas, monospace" font-size="10" fill="#718096">Params: query, dataset_id</text>

  <!-- LLM Agent Box (Center) -->
  <rect x="295" y="110" width="180" height="170" rx="3" fill="#ffffff" stroke="#38a169" stroke-width="2" filter="url(#shadow)"/>
  <rect x="295" y="110" width="180" height="5" fill="#38a169"/>
  <text x="385" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#38a169" text-anchor="middle">LLM AGENT</text>

  <rect x="310" y="150" width="150" height="45" rx="3" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="385" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4a5568" text-anchor="middle">Context Window</text>
  <text x="385" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#718096" text-anchor="middle">+ Tools disponibles</text>

  <rect x="310" y="205" width="150" height="60" rx="3" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="385" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4a5568" text-anchor="middle">Razonamiento:</text>
  <text x="385" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#718096" text-anchor="middle">1. Analizar intent</text>
  <text x="385" y="257" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#718096" text-anchor="middle">2. Match con tools</text>

  <!-- Result Box (Right) -->
  <rect x="515" y="110" width="175" height="170" rx="3" fill="#ffffff" stroke="#dd6b20" stroke-width="2" filter="url(#shadow)"/>
  <rect x="515" y="110" width="175" height="5" fill="#dd6b20"/>
  <text x="602" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#dd6b20" text-anchor="middle">EXECUTION</text>

  <text x="530" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#718096">Tool Call:</text>
  <rect x="530" y="173" width="145" height="30" rx="3" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="602" y="193" font-family="Consolas, monospace" font-size="9" fill="#dd6b20" text-anchor="middle">execute_dax(query=...)</text>

  <text x="530" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#718096">Result:</text>
  <rect x="530" y="233" width="145" height="30" rx="3" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="602" y="253" font-family="Consolas, monospace" font-size="9" fill="#38a169" text-anchor="middle">"Ventas: $1.2M..."</text>

  <!-- Arrows -->
  <line x1="255" y1="195" x2="290" y2="195" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrowblue)"/>
  <text x="272" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#2b6cb0" text-anchor="middle">registro</text>

  <line x1="475" y1="175" x2="510" y2="175" stroke="#dd6b20" stroke-width="2" marker-end="url(#arrowblue)"/>
  <text x="492" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#dd6b20" text-anchor="middle">invoke</text>

  <path d="M 602 280 L 602 300 L 385 300 L 385 280" fill="none" stroke="#38a169" stroke-width="2"/>
  <polygon points="381,285 385,275 389,285" fill="#38a169"/>
  <text x="493" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#38a169" text-anchor="middle">resultado</text>

  <!-- Decision Flow (Bottom) -->
  <rect x="55" y="340" width="635" height="125" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <rect x="55" y="340" width="635" height="5" fill="#718096"/>
  <text x="375" y="368" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3748" text-anchor="middle">DECISION FLOW</text>

  <!-- Step boxes -->
  <rect x="75" y="385" width="130" height="60" rx="3" fill="#f7fafc" stroke="#3182ce" stroke-width="2"/>
  <rect x="75" y="385" width="130" height="4" fill="#3182ce"/>
  <text x="140" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#3182ce" text-anchor="middle">1. User Input</text>
  <text x="140" y="430" font-family="Consolas, monospace" font-size="9" fill="#4a5568" text-anchor="middle">"dame las ventas"</text>

  <rect x="225" y="385" width="130" height="60" rx="3" fill="#f7fafc" stroke="#38a169" stroke-width="2"/>
  <rect x="225" y="385" width="130" height="4" fill="#38a169"/>
  <text x="290" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#38a169" text-anchor="middle">2. Intent Match</text>
  <text x="290" y="430" font-family="Consolas, monospace" font-size="9" fill="#4a5568" text-anchor="middle">pide datos = DAX</text>

  <rect x="375" y="385" width="130" height="60" rx="3" fill="#f7fafc" stroke="#dd6b20" stroke-width="2"/>
  <rect x="375" y="385" width="130" height="4" fill="#dd6b20"/>
  <text x="440" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#dd6b20" text-anchor="middle">3. Tool Call</text>
  <text x="440" y="430" font-family="Consolas, monospace" font-size="9" fill="#4a5568" text-anchor="middle">execute_dax(...)</text>

  <rect x="525" y="385" width="130" height="60" rx="3" fill="#f7fafc" stroke="#805ad5" stroke-width="2"/>
  <rect x="525" y="385" width="130" height="4" fill="#805ad5"/>
  <text x="590" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#805ad5" text-anchor="middle">4. Response</text>
  <text x="590" y="430" font-family="Consolas, monospace" font-size="9" fill="#4a5568" text-anchor="middle">tabla formateada</text>

  <!-- Flow arrows -->
  <line x1="205" y1="415" x2="220" y2="415" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowgray)"/>
  <line x1="355" y1="415" x2="370" y2="415" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowgray)"/>
  <line x1="505" y1="415" x2="520" y2="415" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowgray)"/>

</svg>
