<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="950" height="560">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#000" flood-opacity="0.4"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="950" height="560" fill="none"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="950" height="560" fill="url(#grid)" opacity="0.5"/>

  <!-- Title bar -->
  <rect x="25" y="20" width="900" height="60" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="475" y="57" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">DESAFÍOS ACTUALES - IA AGÉNTICA 2025</text>

  <!-- Main container (10px gap below title) -->
  <rect x="25" y="90" width="900" height="450" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- LLM CORE box -->
  <rect x="40" y="110" width="280" height="410" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="180" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">LLM CORE</text>
  <line x1="60" y1="155" x2="300" y2="155" stroke="#2a2a2a" stroke-width="1"/>

  <circle cx="60" cy="185" r="3" fill="#3b82f6"/>
  <text x="75" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Humildad Epistémica</text>
  <text x="75" y="208" font-family="Arial, sans-serif" font-size="14" fill="#888888">Gemini 3 Flash: 91% alucinación</text>
  <text x="75" y="224" font-family="Arial, sans-serif" font-size="14" fill="#888888">cuando no sabe, no dice "no sé"</text>

  <circle cx="60" cy="254" r="3" fill="#3b82f6"/>
  <text x="75" y="259" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Razonamiento Causal</text>
  <text x="75" y="277" font-family="Arial, sans-serif" font-size="14" fill="#888888">Déficit en lógica compleja y</text>
  <text x="75" y="293" font-family="Arial, sans-serif" font-size="14" fill="#888888">cadenas causales multi-paso</text>

  <circle cx="60" cy="323" r="3" fill="#3b82f6"/>
  <text x="75" y="328" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Metacognición</text>
  <text x="75" y="346" font-family="Arial, sans-serif" font-size="14" fill="#888888">Incapacidad de evaluar su propia</text>
  <text x="75" y="362" font-family="Arial, sans-serif" font-size="14" fill="#888888">incertidumbre y calibración</text>

  <circle cx="60" cy="392" r="3" fill="#3b82f6"/>
  <text x="75" y="397" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Conocimiento Estático</text>
  <text x="75" y="415" font-family="Arial, sans-serif" font-size="14" fill="#888888">Modelo congelado en tiempo. RAG</text>
  <text x="75" y="431" font-family="Arial, sans-serif" font-size="14" fill="#888888">no equivale a conocimiento nativo</text>

  <circle cx="60" cy="461" r="3" fill="#3b82f6"/>
  <text x="75" y="466" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">No Determinismo</text>
  <text x="75" y="484" font-family="Arial, sans-serif" font-size="14" fill="#888888">Outputs impredecibles dificultan</text>
  <text x="75" y="500" font-family="Arial, sans-serif" font-size="14" fill="#888888">testing y garantías de calidad</text>
  
  <!-- SISTEMA box -->
  <rect x="335" y="110" width="280" height="410" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="475" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">SISTEMA</text>
  <line x1="355" y1="155" x2="595" y2="155" stroke="#2a2a2a" stroke-width="1"/>

  <circle cx="355" cy="185" r="3" fill="#3b82f6"/>
  <text x="370" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Integración Legacy</text>
  <text x="370" y="208" font-family="Arial, sans-serif" font-size="14" fill="#888888">40%+ proyectos fallan por sistemas</text>
  <text x="370" y="224" font-family="Arial, sans-serif" font-size="14" fill="#888888">legacy sin APIs modernas (Gartner)</text>

  <circle cx="355" cy="254" r="3" fill="#3b82f6"/>
  <text x="370" y="259" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Coordinación Multi-Agente</text>
  <text x="370" y="277" font-family="Arial, sans-serif" font-size="14" fill="#888888">Orquestación, conflictos y fallas</text>
  <text x="370" y="293" font-family="Arial, sans-serif" font-size="14" fill="#888888">de coordinación entre agentes</text>

  <circle cx="355" cy="323" r="3" fill="#3b82f6"/>
  <text x="370" y="328" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Memoria y Contexto</text>
  <text x="370" y="346" font-family="Arial, sans-serif" font-size="14" fill="#888888">Persistencia limitada y pérdida</text>
  <text x="370" y="362" font-family="Arial, sans-serif" font-size="14" fill="#888888">de estado en tareas largas</text>

  <circle cx="355" cy="392" r="3" fill="#3b82f6"/>
  <text x="370" y="397" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Arquitectura de Datos</text>
  <text x="370" y="415" font-family="Arial, sans-serif" font-size="14" fill="#888888">48% reportan problemas de</text>
  <text x="370" y="431" font-family="Arial, sans-serif" font-size="14" fill="#888888">búsqueda y reuso de datos (Deloitte)</text>

  <circle cx="355" cy="461" r="3" fill="#3b82f6"/>
  <text x="370" y="466" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Infraestructura de Escala</text>
  <text x="370" y="484" font-family="Arial, sans-serif" font-size="14" fill="#888888">Concurrencia masiva, latencia &lt;2s,</text>
  <text x="370" y="500" font-family="Arial, sans-serif" font-size="14" fill="#888888">tareas async de respuesta inmediata</text>
  
  <!-- GOBERNANZA box -->
  <rect x="630" y="110" width="280" height="410" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="770" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">GOBERNANZA</text>
  <line x1="650" y1="155" x2="890" y2="155" stroke="#2a2a2a" stroke-width="1"/>

  <circle cx="650" cy="185" r="3" fill="#3b82f6"/>
  <text x="665" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Seguridad y Ataques</text>
  <text x="665" y="208" font-family="Arial, sans-serif" font-size="14" fill="#888888">Prompt injection, superficie de</text>
  <text x="665" y="224" font-family="Arial, sans-serif" font-size="14" fill="#888888">ataque expandida en multi-agentes</text>

  <circle cx="650" cy="254" r="3" fill="#3b82f6"/>
  <text x="665" y="259" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Confianza y Transparencia</text>
  <text x="665" y="277" font-family="Arial, sans-serif" font-size="14" fill="#888888">Explicabilidad de decisiones</text>
  <text x="665" y="293" font-family="Arial, sans-serif" font-size="14" fill="#888888">autónomas y trazabilidad</text>

  <circle cx="650" cy="323" r="3" fill="#3b82f6"/>
  <text x="665" y="328" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Accountability</text>
  <text x="665" y="346" font-family="Arial, sans-serif" font-size="14" fill="#888888">¿Quién es responsable cuando</text>
  <text x="665" y="362" font-family="Arial, sans-serif" font-size="14" fill="#888888">un agente autónomo falla?</text>

  <circle cx="650" cy="392" r="3" fill="#3b82f6"/>
  <text x="665" y="397" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Regulación y Compliance</text>
  <text x="665" y="415" font-family="Arial, sans-serif" font-size="14" fill="#888888">EU AI Act, privacidad de datos</text>
  <text x="665" y="431" font-family="Arial, sans-serif" font-size="14" fill="#888888">y marcos legales insuficientes</text>

  <circle cx="650" cy="461" r="3" fill="#3b82f6"/>
  <text x="665" y="466" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">ROI y Valor de Negocio</text>
  <text x="665" y="484" font-family="Arial, sans-serif" font-size="14" fill="#888888">80% empresas sin impacto en</text>
  <text x="665" y="500" font-family="Arial, sans-serif" font-size="14" fill="#888888">resultados (McKinsey 2025)</text>
  
</svg>
