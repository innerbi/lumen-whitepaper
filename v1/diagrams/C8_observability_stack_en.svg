<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 580" width="700" height="580">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.1"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="580" fill="none"/>
  
  <!-- Header -->
  <rect x="40" y="25" width="620" height="50" rx="0" fill="#1a365d" filter="url(#shadow)"/>
  <text x="350" y="57" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">OBSERVABILITY STACK</text>
  
  <!-- Main container -->
  <rect x="40" y="90" width="620" height="460" rx="0" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Application container -->
  <rect x="70" y="115" width="560" height="120" rx="3" fill="#ffffff" stroke="#4a5568" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#2d3748" text-anchor="middle">APPLICATION</text>
  
  <!-- Application components -->
  <rect x="100" y="155" width="100" height="40" rx="2" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="150" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2b6cb0" text-anchor="middle">Router</text>
  
  <rect x="220" y="155" width="100" height="40" rx="2" fill="#ffffff" stroke="#38a169" stroke-width="1.5"/>
  <text x="270" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#38a169" text-anchor="middle">Agents</text>
  
  <rect x="340" y="155" width="100" height="40" rx="2" fill="#ffffff" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="390" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#d69e2e" text-anchor="middle">Tools</text>
  
  <rect x="460" y="155" width="100" height="40" rx="2" fill="#ffffff" stroke="#805ad5" stroke-width="1.5"/>
  <text x="510" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#805ad5" text-anchor="middle">Services</text>
  
  <!-- Lines from components down -->
  <line x1="150" y1="195" x2="150" y2="220" stroke="#a0aec0" stroke-width="1"/>
  <line x1="270" y1="195" x2="270" y2="220" stroke="#a0aec0" stroke-width="1"/>
  <line x1="390" y1="195" x2="390" y2="220" stroke="#a0aec0" stroke-width="1"/>
  <line x1="510" y1="195" x2="510" y2="220" stroke="#a0aec0" stroke-width="1"/>
  
  <!-- Horizontal collection line -->
  <line x1="150" y1="220" x2="510" y2="220" stroke="#a0aec0" stroke-width="1"/>
  
  <!-- Vertical line down to telemetry -->
  <line x1="350" y1="235" x2="350" y2="270" stroke="#4a5568" stroke-width="2"/>
  
  <!-- Horizontal distribution to Logs/Metrics/Traces -->
  <line x1="180" y1="270" x2="520" y2="270" stroke="#4a5568" stroke-width="2"/>
  
  <!-- Vertical lines to telemetry boxes -->
  <line x1="180" y1="270" x2="180" y2="300" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="350" y1="270" x2="350" y2="300" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="520" y1="270" x2="520" y2="300" stroke="#4a5568" stroke-width="1.5"/>
  
  <!-- Arrows -->
  <polygon points="176,295 180,305 184,295" fill="#4a5568"/>
  <polygon points="346,295 350,305 354,295" fill="#4a5568"/>
  <polygon points="516,295 520,305 524,295" fill="#4a5568"/>
  
  <!-- Logs box -->
  <rect x="120" y="310" width="120" height="50" rx="3" fill="#ffffff" stroke="#38a169" stroke-width="2" filter="url(#shadow)"/>
  <rect x="120" y="310" width="120" height="4" fill="#38a169"/>
  <text x="180" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#38a169" text-anchor="middle">Logs</text>
  
  <!-- Metrics box -->
  <rect x="290" y="310" width="120" height="50" rx="3" fill="#ffffff" stroke="#2b6cb0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="290" y="310" width="120" height="4" fill="#2b6cb0"/>
  <text x="350" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#2b6cb0" text-anchor="middle">Metrics</text>
  
  <!-- Traces box -->
  <rect x="460" y="310" width="120" height="50" rx="3" fill="#ffffff" stroke="#d69e2e" stroke-width="2" filter="url(#shadow)"/>
  <rect x="460" y="310" width="120" height="4" fill="#d69e2e"/>
  <text x="520" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#d69e2e" text-anchor="middle">Traces</text>
  
  <!-- Lines from telemetry to merge -->
  <line x1="180" y1="360" x2="180" y2="390" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="350" y1="360" x2="350" y2="390" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="520" y1="360" x2="520" y2="390" stroke="#4a5568" stroke-width="1.5"/>
  
  <!-- Horizontal merge line -->
  <line x1="180" y1="390" x2="520" y2="390" stroke="#4a5568" stroke-width="2"/>
  
  <!-- Vertical line to dashboard -->
  <line x1="350" y1="390" x2="350" y2="420" stroke="#4a5568" stroke-width="2"/>
  <polygon points="346,415 350,425 354,415" fill="#4a5568"/>
  
  <!-- Monitoring Dashboard -->
  <rect x="150" y="430" width="400" height="100" rx="3" fill="#ffffff" stroke="#1a365d" stroke-width="2" filter="url(#shadow)"/>
  <rect x="150" y="430" width="400" height="5" fill="#1a365d"/>
  <text x="350" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1a365d" text-anchor="middle">Monitoring Dashboard</text>
  
  <!-- Dashboard items -->
  <circle cx="180" cy="485" r="4" fill="#2b6cb0"/>
  <text x="195" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5568">Request latency</text>
  
  <circle cx="180" cy="510" r="4" fill="#2b6cb0"/>
  <text x="195" y="515" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5568">Token usage</text>
  
  <circle cx="370" cy="485" r="4" fill="#e53e3e"/>
  <text x="385" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5568">Error rates</text>
  
  <circle cx="370" cy="510" r="4" fill="#38a169"/>
  <text x="385" y="515" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5568">Tool invocations</text>
  
</svg>
