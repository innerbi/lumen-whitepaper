<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.1"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="380" fill="none"/>
  
  <!-- Header -->
  <rect x="40" y="25" width="620" height="50" rx="0" fill="#1a365d" filter="url(#shadow)"/>
  <text x="350" y="57" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">AGENT-AS-TOOL</text>
  
  <!-- Main container -->
  <rect x="40" y="90" width="620" height="260" rx="0" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Parent Agent box -->
  <rect x="70" y="115" width="560" height="210" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="115" width="560" height="35" fill="#1a1a1a" rx="3"/>
  <text x="350" y="140" font-family="Consolas, monospace" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Parent Agent</text>
  
  <!-- Tools disponibles -->
  <text x="100" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#2d3748">Tools disponibles:</text>
  
  <!-- Tool 1 -->
  <text x="100" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5568">-</text>
  <text x="115" y="210" font-family="Consolas, monospace" font-size="12" fill="#38a169">search_documents</text>
  <text x="265" y="210" font-family="Consolas, monospace" font-size="11" fill="#718096">(DocumentAgent.as_tool())</text>
  
  <!-- Tool 2 -->
  <text x="100" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5568">-</text>
  <text x="115" y="238" font-family="Consolas, monospace" font-size="12" fill="#2b6cb0">search_web</text>
  <text x="220" y="238" font-family="Consolas, monospace" font-size="11" fill="#718096">(SearchAgent.as_tool())</text>
  
  <!-- Tool 3 -->
  <text x="100" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5568">-</text>
  <text x="115" y="266" font-family="Consolas, monospace" font-size="12" fill="#d69e2e">calculate_metrics</text>
  <text x="275" y="266" font-family="Consolas, monospace" font-size="11" fill="#718096">(CalculatorAgent.as_tool())</text>
  
  <!-- Separator -->
  <line x1="90" y1="285" x2="610" y2="285" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Note -->
  <text x="100" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5568">El LLM decide cuando invocar cada tool</text>
  
</svg>
