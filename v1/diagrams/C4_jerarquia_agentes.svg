  <line x1="80" y1="265" x2="80" y2="290" stroke="#a0aec0" stroke-width="1"/>
  <line x1="190" y1="265" x2="190" y2="290" stroke="#a0aec0" stroke-width="1"/>
  <line x1="300" y1="265" x2="300" y2="290" stroke="#a0aec0" stroke-width="1"/>
