  <text x="550" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4a5568" text-anchor="middle">Embed</text>
  
  <rect x="610" y="295" width="100" height="35" rx="2" fill="#edf2f7" stroke="#a0aec0" stroke-width="1"/>
  <text x="660" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4a5568" text-anchor="middle">PowerBI</text>
  <text x="660" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4a5568" text-anchor="middle">MCP</text>
  
  <rect x="720" y="295" width="100" height="35" rx="2" fill="#edf2f7" stroke="#a0aec0" stroke-width="1"/>
  <text x="770" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4a5568" text-anchor="middle">Docling</text>
  <text x="770" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4a5568" text-anchor="middle">Extract</text>
  
  <!-- GeneralAgent sub-agents section -->
