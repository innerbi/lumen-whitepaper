  <line x1="230" y1="380" x2="230" y2="405" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="350" y1="380" x2="350" y2="405" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="470" y1="380" x2="470" y2="405" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="590" y1="380" x2="590" y2="405" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <!-- Arrows for sub-agents -->
  <polygon points="106,400 110,410 114,400" fill="#1a1a1a"/>
  <polygon points="226,400 230,410 234,400" fill="#1a1a1a"/>
  <polygon points="346,400 350,410 354,400" fill="#1a1a1a"/>
  <polygon points="466,400 470,410 474,400" fill="#1a1a1a"/>
  <polygon points="586,400 590,410 594,400" fill="#1a1a1a"/>
  
  <!-- Sub-agent boxes -->
  <rect x="60" y="415" width="100" height="50" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="60" y="415" width="100" height="4" fill="#1a1a1a"/>
  <text x="110" y="440" font-family="Consolas, monospace" font-size="10" fill="#2d3748" text-anchor="middle">Planning</text>
  <text x="110" y="455" font-family="Consolas, monospace" font-size="10" fill="#2d3748" text-anchor="middle">Agent</text>
  
  <rect x="180" y="415" width="100" height="50" rx="3" fill="#ffffff" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="180" y="415" width="100" height="4" fill="#f97316"/>
  <text x="230" y="440" font-family="Consolas, monospace" font-size="10" fill="#2d3748" text-anchor="middle">Search</text>
  <text x="230" y="455" font-family="Consolas, monospace" font-size="10" fill="#2d3748" text-anchor="middle">Agent</text>
  
  <rect x="300" y="415" width="100" height="50" rx="3" fill="#ffffff" stroke="#eab308" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="300" y="415" width="100" height="4" fill="#eab308"/>
  <text x="350" y="440" font-family="Consolas, monospace" font-size="10" fill="#2d3748" text-anchor="middle">Summary</text>
  <text x="350" y="455" font-family="Consolas, monospace" font-size="10" fill="#2d3748" text-anchor="middle">Agent</text>
  
  <rect x="420" y="415" width="100" height="50" rx="3" fill="#ffffff" stroke="#d946ef" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="420" y="415" width="100" height="4" fill="#d946ef"/>
  <text x="470" y="440" font-family="Consolas, monospace" font-size="10" fill="#2d3748" text-anchor="middle">Formatter</text>
  <text x="470" y="455" font-family="Consolas, monospace" font-size="10" fill="#2d3748" text-anchor="middle">Agent</text>
  
  <rect x="540" y="415" width="100" height="50" rx="3" fill="#ffffff" stroke="#a0aec0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="445" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#718096" text-anchor="middle">(otros)</text>
  
  <!-- Label for sub-agents section -->
  <text x="70" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#718096">Sub-agentes de GeneralAgent</text>
  
