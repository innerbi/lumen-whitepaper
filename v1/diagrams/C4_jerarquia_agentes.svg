  <rect x="375" y="220" width="100" height="5" fill="#1a1a1a"/>
  <text x="425" y="250" font-family="Consolas, monospace" font-size="10" font-weight="600" fill="#2d3748" text-anchor="middle">GeneralAgent</text>
  
