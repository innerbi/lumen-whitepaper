  <text x="80" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4a5568" text-anchor="middle">MCP</text>
  
  <rect x="140" y="295" width="100" height="35" rx="2" fill="#edf2f7" stroke="#a0aec0" stroke-width="1"/>
  <text x="190" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4a5568" text-anchor="middle">Fabric</text>
  <text x="190" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4a5568" text-anchor="middle">API</text>
  
  <rect x="250" y="295" width="100" height="35" rx="2" fill="#edf2f7" stroke="#a0aec0" stroke-width="1"/>
  <text x="300" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4a5568" text-anchor="middle">Weaviate</text>
  <text x="300" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4a5568" text-anchor="middle">search</text>
  
  <rect x="375" y="295" width="100" height="35" rx="2" fill="#edf2f7" stroke="#a0aec0" stroke-width="1"/>
  <text x="425" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4a5568" text-anchor="middle">Compone</text>
  <text x="425" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4a5568" text-anchor="middle">tools</text>
  
  <rect x="500" y="295" width="100" height="35" rx="2" fill="#edf2f7" stroke="#a0aec0" stroke-width="1"/>
