  <text x="550" y="250" font-family="Consolas, monospace" font-size="10" font-weight="600" fill="#2d3748" text-anchor="middle">ReportAgent</text>
  
  <!-- PowerBIAgent -->
  <rect x="610" y="220" width="100" height="45" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="610" y="220" width="100" height="5" fill="#1a1a1a"/>
  <text x="660" y="250" font-family="Consolas, monospace" font-size="10" font-weight="600" fill="#2d3748" text-anchor="middle">PowerBIAgent</text>
  
  <!-- PDFAgent -->
  <rect x="720" y="220" width="100" height="45" rx="3" fill="#ffffff" stroke="#d946ef" stroke-width="2" filter="url(#shadow)"/>
  <rect x="720" y="220" width="100" height="5" fill="#d946ef"/>
  <text x="770" y="250" font-family="Consolas, monospace" font-size="11" font-weight="600" fill="#2d3748" text-anchor="middle">PDFAgent</text>
  
