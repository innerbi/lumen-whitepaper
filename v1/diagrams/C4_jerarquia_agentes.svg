<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 620" width="850" height="620">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.1"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="850" height="620" fill="none"/>
  
  <!-- Header -->
  <rect x="20" y="25" width="810" height="50" rx="0" fill="#1a365d" filter="url(#shadow)"/>
  <text x="425" y="57" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">JERARQUÍA DE AGENTES</text>
  
  <!-- Main container -->
  <rect x="20" y="90" width="810" height="460" rx="0" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- BaseAgent - Root -->
  <rect x="340" y="115" width="170" height="45" rx="3" fill="#1a365d" filter="url(#shadow)"/>
  <text x="425" y="143" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">BaseAgent</text>
  
  <!-- Vertical line from BaseAgent -->
  <line x1="425" y1="160" x2="425" y2="185" stroke="#4a5568" stroke-width="2"/>
  
  <!-- Horizontal connector line -->
  <line x1="80" y1="185" x2="770" y2="185" stroke="#4a5568" stroke-width="2"/>
  
  <!-- Vertical lines down to agents -->
  <line x1="80" y1="185" x2="80" y2="210" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="190" y1="185" x2="190" y2="210" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="300" y1="185" x2="300" y2="210" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="425" y1="185" x2="425" y2="210" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="550" y1="185" x2="550" y2="210" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="660" y1="185" x2="660" y2="210" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="770" y1="185" x2="770" y2="210" stroke="#4a5568" stroke-width="1.5"/>
  
  <!-- Arrows -->
  <polygon points="76,205 80,215 84,205" fill="#4a5568"/>
  <polygon points="186,205 190,215 194,205" fill="#4a5568"/>
  <polygon points="296,205 300,215 304,205" fill="#4a5568"/>
  <polygon points="421,205 425,215 429,205" fill="#4a5568"/>
  <polygon points="546,205 550,215 554,205" fill="#4a5568"/>
  <polygon points="656,205 660,215 664,205" fill="#4a5568"/>
  <polygon points="766,205 770,215 774,205" fill="#4a5568"/>
  
  <!-- Agent boxes - Row 1 -->
  <!-- DAXAgent -->
  <rect x="30" y="220" width="100" height="45" rx="3" fill="#ffffff" stroke="#38a169" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="220" width="100" height="5" fill="#38a169"/>
  <text x="80" y="250" font-family="Consolas, monospace" font-size="11" font-weight="600" fill="#2d3748" text-anchor="middle">DAXAgent</text>
  
  <!-- FabricAgent -->
  <rect x="140" y="220" width="100" height="45" rx="3" fill="#ffffff" stroke="#38a169" stroke-width="2" filter="url(#shadow)"/>
