<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530">
  <!-- Background -->
  <rect width="800" height="530" fill="none"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="530" fill="url(#grid)" opacity="0.5"/>

  <!-- Title bar -->
  <rect x="25" y="20" width="750" height="60" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="400" y="57" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">ARQUITECTURA GENERADOR-CRÍTICO</text>

  <!-- Main container (10px gap below title) -->
  <rect x="25" y="90" width="750" height="420" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Generador box -->
  <rect x="100" y="130" width="180" height="120" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="190" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">GENERADOR</text>
  <text x="190" y="215" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">Crea draft</text>

  <!-- Crítico box -->
  <rect x="520" y="130" width="180" height="120" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="610" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">CRÍTICO</text>
  <text x="610" y="215" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">Evalúa</text>

  <!-- Arrow: Output (Generador -> Crítico) -->
  <line x1="280" y1="170" x2="520" y2="170" stroke="#888888" stroke-width="1"/>
  <polygon points="515,166 525,170 515,174" fill="#888888"/>
  <text x="400" y="162" font-family="Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">Output</text>

  <!-- Arrow: Feedback (Crítico -> Generador) -->
  <line x1="520" y1="220" x2="280" y2="220" stroke="#888888" stroke-width="1"/>
  <polygon points="285,216 275,220 285,224" fill="#888888"/>
  <text x="400" y="240" font-family="Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">Feedback</text>

  <!-- Loop indicator -->
  <rect x="100" y="285" width="600" height="50" rx="4" fill="none" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="400" y="315" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Iteración hasta aprobación</text>

  <!-- Vertical line down -->
  <line x1="400" y1="335" x2="400" y2="385" stroke="#888888" stroke-width="1"/>
  <polygon points="396,380 400,390 404,380" fill="#888888"/>

  <!-- Output Final box -->
  <rect x="250" y="400" width="300" height="80" rx="4" fill="#1a1a1a" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="400" y="435" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">OUTPUT FINAL</text>
  <text x="400" y="460" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">(Validado)</text>

</svg>
