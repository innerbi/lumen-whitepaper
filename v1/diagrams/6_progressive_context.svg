<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.1"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="480" fill="none"/>
  
  <!-- Header -->
  <rect x="40" y="25" width="620" height="50" rx="0" fill="#1a365d" filter="url(#shadow)"/>
  <text x="350" y="57" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">PROGRESSIVE CONTEXT BUILDING</text>
  
  <!-- Main container -->
  <rect x="40" y="90" width="620" height="360" rx="0" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Query example -->
  <text x="60" y="125" font-family="Consolas, monospace" font-size="13" fill="#2b6cb0">QUERY:</text>
  <text x="130" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5568" font-style="italic">"¿Cuáles son las ventas?"</text>
  
  <!-- Level 0 -->
  <text x="60" y="165" font-family="Consolas, monospace" font-size="13" font-weight="600" fill="#38a169">Nivel 0:</text>
  <text x="140" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d3748">Query only</text>
  <rect x="500" y="150" width="100" height="24" rx="2" fill="#38a169"/>
  <text x="550" y="167" font-family="Consolas, monospace" font-size="11" fill="#ffffff" text-anchor="middle">50 tokens</text>
  <text x="80" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#718096">├─ Si LLM puede responder → DONE</text>
  
  <!-- Level 1 -->
  <text x="60" y="225" font-family="Consolas, monospace" font-size="13" font-weight="600" fill="#2b6cb0">Nivel 1:</text>
  <text x="140" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d3748">+ Session context</text>
  <rect x="500" y="210" width="100" height="24" rx="2" fill="#2b6cb0"/>
  <text x="550" y="227" font-family="Consolas, monospace" font-size="11" fill="#ffffff" text-anchor="middle">+200 tokens</text>
  <text x="80" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#718096">├─ Si necesita historial → agregar</text>
  
  <!-- Level 2 -->
  <text x="60" y="285" font-family="Consolas, monospace" font-size="13" font-weight="600" fill="#d69e2e">Nivel 2:</text>
  <text x="140" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d3748">+ Retrieved documents</text>
  <rect x="500" y="270" width="100" height="24" rx="2" fill="#d69e2e"/>
  <text x="550" y="287" font-family="Consolas, monospace" font-size="11" fill="#ffffff" text-anchor="middle">+500 tokens</text>
  <text x="80" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#718096">├─ Si necesita conocimiento → RAG</text>
  
  <!-- Level 3 -->
  <text x="60" y="345" font-family="Consolas, monospace" font-size="13" font-weight="600" fill="#e53e3e">Nivel 3:</text>
  <text x="140" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d3748">+ Full memory + metadata</text>
  <rect x="500" y="330" width="100" height="24" rx="2" fill="#e53e3e"/>
  <text x="550" y="347" font-family="Consolas, monospace" font-size="11" fill="#ffffff" text-anchor="middle">+1000 tokens</text>
  <text x="80" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#718096">└─ Solo para queries muy complejas</text>
  
  <!-- Benefit section -->
  <line x1="60" y1="390" x2="640" y2="390" stroke="#e2e8f0" stroke-width="1"/>
  
  <rect x="60" y="405" width="580" height="35" rx="2" fill="#ebf8ff" stroke="#bee3f8" stroke-width="1"/>
  <text x="80" y="428" font-family="Consolas, monospace" font-size="12" fill="#2b6cb0">BENEFICIO:</text>
  <text x="180" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2d3748">Queries simples usan ~50 tokens vs ~1750</text>
  
</svg>
