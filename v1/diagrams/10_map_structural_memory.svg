<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" width="780" height="520">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
