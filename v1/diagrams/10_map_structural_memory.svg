  <rect x="175" y="400" width="80" height="35" rx="4" fill="#1a1a1a" stroke="#ffffff" stroke-width="1"/>
  <text x="215" y="422" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Router</text>

