  <rect x="580" y="400" width="80" height="35" rx="4" fill="#1a1a1a" stroke="#ffffff" stroke-width="1"/>
  <text x="620" y="422" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Agent</text>

  <!-- Feedback arrow -->
  <path d="M 620 435 L 620 465 L 390 465 L 390 450" stroke="#888888" stroke-width="1" fill="none" stroke-dasharray="4,2"/>
  <polygon points="386,453 390,443 394,453" fill="#888888"/>
  <text x="505" y="478" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">Episodio termina → Actualiza W_ij[intent]</text>

