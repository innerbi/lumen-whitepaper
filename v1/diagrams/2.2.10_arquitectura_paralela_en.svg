<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <marker id="arrowhead3" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#3b82f6"/>
    </marker>
    <marker id="arrowhead3-green" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="530" fill="none"/>
  <rect width="800" height="530" fill="url(#grid)" opacity="0.5"/>

  <!-- Title bar -->
  <rect x="25" y="20" width="750" height="60" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="400" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" letter-spacing="2">PARALLEL ARCHITECTURE (Fan-out / Fan-in)</text>

  <!-- Main container (10px gap below title) -->
  <rect x="25" y="90" width="750" height="420" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Input -->
  <rect x="50" y="205" width="90" height="65" fill="#1a1a1a" stroke="#888888" stroke-width="2" rx="4"/>
  <text x="95" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Input</text>

  <!-- Fan-out arrows -->
  <path d="M 145 237 L 215 155" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead3)"/>
  <path d="M 145 237 L 215 237" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead3)"/>
  <path d="M 145 237 L 215 325" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead3)"/>

  <!-- Agent A -->
  <rect x="225" y="120" width="140" height="70" fill="#1a1a1a" stroke="#3b82f6" stroke-width="1" rx="4"/>
  <text x="295" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Agent A</text>
  <text x="295" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888888">(Search)</text>

  <!-- Agent B -->
  <rect x="225" y="202" width="140" height="70" fill="#1a1a1a" stroke="#3b82f6" stroke-width="1" rx="4"/>
  <text x="295" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Agent B</text>
  <text x="295" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888888">(RAG)</text>

  <!-- Agent C -->
  <rect x="225" y="290" width="140" height="70" fill="#1a1a1a" stroke="#3b82f6" stroke-width="1" rx="4"/>
  <text x="295" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Agent C</text>
  <text x="295" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888888">(DAX)</text>

  <!-- Fan-in arrows -->
  <path d="M 370 155 L 440 237" stroke="#22c55e" stroke-width="2"/>
  <path d="M 370 237 L 440 237" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead3-green)"/>
  <path d="M 370 325 L 440 237" stroke="#22c55e" stroke-width="2"/>

  <!-- Combine -->
  <rect x="450" y="195" width="140" height="85" fill="#1a1a1a" stroke="#22c55e" stroke-width="2" rx="4"/>
  <text x="520" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#22c55e">Combine</text>
  <text x="520" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888888">(Merge)</text>

  <!-- Arrow to Output -->
  <line x1="595" y1="237" x2="645" y2="237" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead3-green)"/>

  <!-- Output -->
  <rect x="655" y="205" width="90" height="65" fill="#1a1a1a" stroke="#888888" stroke-width="2" rx="4"/>
  <text x="700" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Output</text>

  <!-- Labels -->
  <text x="165" y="180" font-family="Arial, sans-serif" font-size="11" fill="#3b82f6" font-style="italic">Fan-out</text>
  <text x="395" y="180" font-family="Arial, sans-serif" font-size="11" fill="#22c55e" font-style="italic">Fan-in</text>

  <!-- Example -->
  <rect x="50" y="410" width="590" height="80" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" rx="4" stroke-dasharray="4,2"/>
  <text x="345" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888888">Example: "Sales and documents" → [DAXAgent, DocumentAgent] → SummaryAgent</text>
  <text x="345" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666666">Use: Multiple sources, latency reduction, redundancy</text>

  <!-- Parallel indicator -->
  <rect x="660" y="320" width="100" height="90" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" rx="4" stroke-dasharray="4,2"/>
  <text x="710" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#888888">PARALLEL</text>
  <text x="710" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#888888">Execution</text>
  <text x="710" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666666">asyncio.gather()</text>
</svg>
