<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.1"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="380" fill="none"/>
  
  <!-- Header -->
  <rect x="40" y="25" width="620" height="50" rx="0" fill="#1a365d" filter="url(#shadow)"/>
  <text x="350" y="57" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">CONNECTION POOL</text>
  
  <!-- Main container -->
  <rect x="40" y="90" width="620" height="260" rx="0" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Requests -->
  <text x="60" y="135" font-family="Consolas, monospace" font-size="13" fill="#2d3748">Request 1</text>
  <text x="60" y="165" font-family="Consolas, monospace" font-size="13" fill="#2d3748">Request 2</text>
  <text x="60" y="195" font-family="Consolas, monospace" font-size="13" fill="#2d3748">Request 3</text>
  
  <!-- Bracket for requests -->
  <path d="M 145 125 L 155 125 L 155 200 L 145 200" fill="none" stroke="#4a5568" stroke-width="1.5"/>
  
  <!-- Arrow to Pool -->
  <line x1="155" y1="162" x2="195" y2="162" stroke="#2b6cb0" stroke-width="2"/>
  <polygon points="190,158 200,162 190,166" fill="#2b6cb0"/>
  
  <!-- Pool box -->
  <rect x="205" y="130" width="300" height="65" rx="3" fill="#ffffff" stroke="#2b6cb0" stroke-width="2" filter="url(#shadow)"/>
  <text x="225" y="168" font-family="Consolas, monospace" font-size="13" fill="#2b6cb0">Pool:</text>
  <text x="275" y="168" font-family="Consolas, monospace" font-size="13" fill="#4a5568">[Conn1, Conn2, Conn3, ...]</text>
  
  <!-- Connection indicators inside pool - below connections, centered under each word -->
  <circle cx="295" cy="182" r="4" fill="#38a169"/>
  <circle cx="350" cy="182" r="4" fill="#38a169"/>
  <circle cx="405" cy="182" r="4" fill="#38a169"/>
  <circle cx="450" cy="182" r="4" fill="#a0aec0"/>
  
  <!-- Arrow to DB -->
  <line x1="505" y1="162" x2="555" y2="162" stroke="#2b6cb0" stroke-width="2"/>
  <line x1="555" y1="162" x2="505" y2="162" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="550,158 560,162 550,166" fill="#2b6cb0"/>
  <polygon points="515,158 505,162 515,166" fill="#2b6cb0"/>
  
  <!-- DB cylinder - flipped 180 degrees -->
  <ellipse cx="600" cy="180" rx="35" ry="12" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5"/>
  <rect x="565" y="145" width="70" height="35" fill="#edf2f7"/>
  <line x1="565" y1="145" x2="565" y2="180" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="635" y1="145" x2="635" y2="180" stroke="#4a5568" stroke-width="1.5"/>
  <ellipse cx="600" cy="145" rx="35" ry="12" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
  
  <!-- Features section -->
  <line x1="60" y1="220" x2="640" y2="220" stroke="#e2e8f0" stroke-width="1"/>
  
  <circle cx="70" cy="250" r="4" fill="#38a169"/>
  <text x="85" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d3748">Conexiones pre-creadas</text>
  
  <circle cx="70" cy="280" r="4" fill="#38a169"/>
  <text x="85" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d3748">Reutilizadas entre requests</text>
  
  <circle cx="350" cy="250" r="4" fill="#2b6cb0"/>
  <text x="365" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d3748">Health checks periódicos</text>
  
  <circle cx="350" cy="280" r="4" fill="#2b6cb0"/>
  <text x="365" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d3748">Auto-scaling según demanda</text>
  
</svg>
