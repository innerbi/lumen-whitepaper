<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="700" height="450">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="450" fill="none"/>
  <rect width="700" height="450" fill="url(#grid)" opacity="0.4"/>

  <!-- Title bar -->
  <rect x="25" y="20" width="650" height="60" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="350" y="57" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">SINGLE vs MULTI-AGENT</text>

  <!-- Main container (10px gap below title) -->
  <rect x="25" y="90" width="650" height="340" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Header row -->
  <text x="50" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#888888">Metric</text>
  <text x="280" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#888888" text-anchor="middle">Single Agent</text>
  <text x="520" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#888888" text-anchor="middle">Multi-Agent</text>

  <!-- Divider line -->
  <line x1="50" y1="165" x2="650" y2="165" stroke="#333333" stroke-width="1"/>

  <!-- Row 1: Task Completion -->
  <text x="50" y="200" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Task Completion</text>

  <!-- Single Agent bar 65-75% -->
  <rect x="200" y="187" width="160" height="18" rx="3" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
  <rect x="202" y="189" width="112" height="14" rx="2" fill="#666666"/>
  <text x="280" y="200" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">65-75%</text>

  <!-- Multi-Agent bar 80-90% -->
  <rect x="440" y="187" width="160" height="18" rx="3" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
  <rect x="442" y="189" width="136" height="14" rx="2" fill="#3b82f6"/>
  <text x="520" y="200" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">80-90%</text>

  <!-- Row 2: Latency -->
  <text x="50" y="245" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Latency</text>

  <!-- Single Agent bar - High -->
  <rect x="200" y="232" width="160" height="18" rx="3" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
  <rect x="202" y="234" width="140" height="14" rx="2" fill="#666666"/>
  <text x="280" y="245" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">High</text>

  <!-- Multi-Agent bar - Faster -->
  <rect x="440" y="232" width="160" height="18" rx="3" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
  <rect x="442" y="234" width="85" height="14" rx="2" fill="#3b82f6"/>
  <text x="520" y="245" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">40% Faster</text>

  <!-- Row 3: Specialization -->
  <text x="50" y="290" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Specialization</text>

  <!-- Single Agent bar - Low -->
  <rect x="200" y="277" width="160" height="18" rx="3" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
  <rect x="202" y="279" width="48" height="14" rx="2" fill="#666666"/>
  <text x="280" y="290" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Low</text>

  <!-- Multi-Agent bar - High -->
  <rect x="440" y="277" width="160" height="18" rx="3" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
  <rect x="442" y="279" width="140" height="14" rx="2" fill="#3b82f6"/>
  <text x="520" y="290" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">High</text>

  <!-- Row 4: Maintainability -->
  <text x="50" y="335" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Maintainability</text>

  <!-- Single Agent bar - Medium -->
  <rect x="200" y="322" width="160" height="18" rx="3" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
  <rect x="202" y="324" width="80" height="14" rx="2" fill="#666666"/>
  <text x="280" y="335" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Medium</text>

  <!-- Multi-Agent bar - High -->
  <rect x="440" y="322" width="160" height="18" rx="3" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
  <rect x="442" y="324" width="140" height="14" rx="2" fill="#3b82f6"/>
  <text x="520" y="335" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">High</text>

  <!-- Row 5: Initial Complexity -->
  <text x="50" y="380" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Initial Complexity</text>

  <!-- Single Agent bar - Low -->
  <rect x="200" y="367" width="160" height="18" rx="3" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
  <rect x="202" y="369" width="48" height="14" rx="2" fill="#3b82f6"/>
  <text x="280" y="380" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Low</text>

  <!-- Multi-Agent bar - Medium-High -->
  <rect x="440" y="367" width="160" height="18" rx="3" fill="#1a1a1a" stroke="#333333" stroke-width="1"/>
  <rect x="442" y="369" width="120" height="14" rx="2" fill="#666666"/>
  <text x="520" y="380" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Medium-High</text>

</svg>
