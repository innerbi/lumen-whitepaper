<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.1"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="520" fill="none"/>
  
  <!-- Header -->
  <rect x="40" y="25" width="620" height="50" rx="0" fill="#1a365d" filter="url(#shadow)"/>
  <text x="350" y="57" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">SEMANTIC CACHE INVALIDATION</text>
  
  <!-- Main container -->
  <rect x="40" y="90" width="620" height="400" rx="0" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Query -->
  <text x="60" y="125" font-family="Consolas, monospace" font-size="13" fill="#2b6cb0">Query:</text>
  <text x="120" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5568" font-style="italic">"ventas del mes pasado"</text>
  
  <!-- Step 1 -->
  <text x="60" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d3748">1. Compute</text>
  <text x="140" y="165" font-family="Consolas, monospace" font-size="12" fill="#805ad5">embedding(query)</text>
  
  <!-- Step 2 -->
  <text x="60" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d3748">2. Search cache por similitud:</text>
  
  <!-- Table -->
  <rect x="80" y="215" width="480" height="130" rx="2" fill="#ffffff" stroke="#a0aec0" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Table header -->
  <rect x="80" y="215" width="480" height="30" fill="#edf2f7"/>
  <text x="100" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#4a5568">Cache Key (embedding)</text>
  <text x="380" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#4a5568">Similarity</text>
  <text x="480" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#4a5568">Hit?</text>
  
  <!-- Table rows -->
  <line x1="80" y1="245" x2="560" y2="245" stroke="#e2e8f0" stroke-width="1"/>
  
  <text x="100" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5568">"ventas mes anterior"</text>
  <text x="395" y="270" font-family="Consolas, monospace" font-size="12" fill="#38a169">0.94</text>
  <text x="490" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#38a169">✓</text>
  
  <line x1="90" y1="285" x2="550" y2="285" stroke="#e2e8f0" stroke-width="1"/>
  
  <text x="100" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5568">"revenue last month"</text>
  <text x="395" y="310" font-family="Consolas, monospace" font-size="12" fill="#38a169">0.89</text>
  <text x="490" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#38a169">✓</text>
  
  <line x1="90" y1="325" x2="550" y2="325" stroke="#e2e8f0" stroke-width="1"/>
  
  <text x="100" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5568">"ganancias mensuales"</text>
  <text x="395" y="338" font-family="Consolas, monospace" font-size="12" fill="#e53e3e">0.72</text>
  <text x="490" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e53e3e">✗</text>
  
  <!-- Step 3 -->
  <text x="60" y="375" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d3748">3. Si similarity > 0.85 → return cached response</text>
  
  <!-- Step 4 -->
  <text x="60" y="415" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d3748">4. Invalidación: cuando data source cambia,</text>
  <text x="80" y="435" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5568">invalidar cluster semántico completo</text>
  
</svg>
