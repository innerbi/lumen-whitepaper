<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530">
  <!-- Background -->
  <rect width="800" height="530" fill="none"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="530" fill="url(#grid)" opacity="0.5"/>

  <!-- Title bar -->
  <rect x="25" y="20" width="750" height="60" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="400" y="57" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">META-LEARNING ARCHITECTURE</text>

  <!-- Main container (10px gap below title) -->
  <rect x="25" y="90" width="750" height="420" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- OUTER LOOP box - centered -->
  <rect x="100" y="115" width="550" height="145" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="375" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">OUTER LOOP (Meta)</text>

  <circle cx="125" cy="178" r="3" fill="#3b82f6"/>
  <text x="140" y="183" font-family="Arial, sans-serif" font-size="12" fill="#888888">Adjusts how the inner loop learns</text>

  <circle cx="125" cy="205" r="3" fill="#3b82f6"/>
  <text x="140" y="210" font-family="Arial, sans-serif" font-size="12" fill="#888888">Optimizes hyperparameters</text>

  <circle cx="125" cy="232" r="3" fill="#3b82f6"/>
  <text x="140" y="237" font-family="Arial, sans-serif" font-size="12" fill="#888888">Selects learning strategies</text>

  <!-- Outer loop arrow (right side going up) -->
  <path d="M 660 185 L 660 115 L 700 115 L 700 425 L 660 425 L 660 360" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="655,360 660,345 665,360" fill="#3b82f6"/>
  <text x="718" y="275" font-family="Arial, sans-serif" font-size="11" fill="#3b82f6" transform="rotate(90 718 275)">Meta Loop</text>

  <!-- Arrow down to interior -->
  <line x1="375" y1="260" x2="375" y2="295" stroke="#888888" stroke-width="1"/>
  <polygon points="370,290 375,300 380,290" fill="#888888"/>

  <!-- INNER LOOP box - centered -->
  <rect x="100" y="310" width="550" height="145" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="375" y="340" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">INNER LOOP (Task)</text>

  <circle cx="125" cy="373" r="3" fill="#3b82f6"/>
  <text x="140" y="378" font-family="Arial, sans-serif" font-size="12" fill="#888888">Learns policy for specific task</text>

  <circle cx="125" cy="400" r="3" fill="#3b82f6"/>
  <text x="140" y="405" font-family="Arial, sans-serif" font-size="12" fill="#888888">Fast adaptation to new tasks</text>

  <circle cx="125" cy="427" r="3" fill="#3b82f6"/>
  <text x="140" y="432" font-family="Arial, sans-serif" font-size="12" fill="#888888">Generalizes across similar tasks</text>

  <!-- Inner loop arrow (left side) -->
  <path d="M 90 340 L 70 340 L 70 425 L 90 425" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="90,335 100,340 90,345" fill="#3b82f6"/>
  <text x="55" y="385" font-family="Arial, sans-serif" font-size="10" fill="#3b82f6" transform="rotate(-90 55 385)">Task Loop</text>

  <!-- Labels at bottom -->
  <text x="400" y="495" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">The outer loop optimizes how the inner loop learns from each task</text>

</svg>
