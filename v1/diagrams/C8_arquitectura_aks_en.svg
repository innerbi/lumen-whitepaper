<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.1"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a5568"/>
    </marker>
    <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <circle cx="3" cy="3" r="2.5" fill="#4a5568"/>
    </marker>
  </defs>

  <!-- Background (transparent) -->
  <rect width="800" height="500" fill="none"/>

  <!-- Header -->
  <rect x="40" y="15" width="720" height="45" rx="0" fill="#1a365d" filter="url(#shadow)"/>
  <text x="400" y="45" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">PHYSICAL ARCHITECTURE - AKS</text>

  <!-- Main container -->
  <rect x="40" y="70" width="720" height="415" rx="0" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Backend (App Service - outside AKS) -->
  <rect x="55" y="130" width="115" height="45" rx="2" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="112" y="148" font-family="Consolas, monospace" font-size="9" font-weight="600" fill="#2b6cb0" text-anchor="middle">BACKEND</text>
  <text x="112" y="161" font-family="Consolas, monospace" font-size="7" fill="#4a5568" text-anchor="middle">FastAPI + Agents</text>
  <text x="112" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="6" fill="#718096" text-anchor="middle">(App Service)</text>

  <!-- AKS Cluster container -->
  <rect x="185" y="85" width="400" height="385" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
  <text x="385" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#718096" text-anchor="middle">AKS CLUSTER</text>

  <!-- SYSTEM NODES SECTION -->
  <rect x="200" y="110" width="370" height="75" rx="2" fill="#f0fff4" stroke="#38a169" stroke-width="1"/>
  <text x="215" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" fill="#38a169">SYSTEM POOL (Regular Nodes)</text>

  <!-- Redis Pod (left - receives from Backend) -->
  <rect x="215" y="135" width="130" height="40" rx="2" fill="#fed7d7" stroke="#e53e3e" stroke-width="1.5"/>
  <text x="280" y="152" font-family="Consolas, monospace" font-size="9" font-weight="600" fill="#e53e3e" text-anchor="middle">REDIS</text>
  <text x="280" y="167" font-family="Consolas, monospace" font-size="7" fill="#4a5568" text-anchor="middle">Streams + Cache</text>

  <!-- Ray Head Pod (right) -->
  <rect x="402" y="135" width="130" height="40" rx="2" fill="#fef3c7" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="467" y="152" font-family="Consolas, monospace" font-size="9" font-weight="600" fill="#d69e2e" text-anchor="middle">RAY HEAD</text>
  <text x="467" y="167" font-family="Consolas, monospace" font-size="7" fill="#4a5568" text-anchor="middle">Dashboard + Scheduler</text>

  <!-- SPOT NODES SECTION -->
  <rect x="200" y="200" width="370" height="260" rx="2" fill="#faf5ff" stroke="#7b1fa2" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Batch Workers (boxes) -->
  <rect x="215" y="250" width="130" height="55" rx="2" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1"/>
  <text x="280" y="268" font-family="Consolas, monospace" font-size="8" font-weight="600" fill="#2b6cb0" text-anchor="middle">BATCH 0-3</text>
  <text x="280" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="7" fill="#4a5568" text-anchor="middle">Docling + Consumer</text>
  <text x="280" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="7" fill="#718096" text-anchor="middle">D8s_v6 (8CPU, 16Gi)</text>

  <rect x="375" y="250" width="55" height="55" rx="2" fill="#fef3c7" stroke="#d69e2e" stroke-width="1"/>
  <text x="402" y="270" font-family="Consolas, monospace" font-size="7" font-weight="600" fill="#d69e2e" text-anchor="middle">W0</text>
  <text x="402" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="6" fill="#4a5568" text-anchor="middle">Chunk</text>

  <rect x="440" y="250" width="55" height="55" rx="2" fill="#fef3c7" stroke="#d69e2e" stroke-width="1"/>
  <text x="467" y="270" font-family="Consolas, monospace" font-size="7" font-weight="600" fill="#d69e2e" text-anchor="middle">W1</text>
  <text x="467" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="6" fill="#4a5568" text-anchor="middle">Embed</text>

  <rect x="505" y="250" width="55" height="55" rx="2" fill="#fef3c7" stroke="#d69e2e" stroke-width="1"/>
  <text x="532" y="270" font-family="Consolas, monospace" font-size="7" font-weight="600" fill="#d69e2e" text-anchor="middle">WN</text>
  <text x="532" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="6" fill="#4a5568" text-anchor="middle">Store</text>

  <!-- Weaviate Pod - in SPOT -->
  <text x="215" y="325" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="600" fill="#38a169">Vector Database (StatefulSet + PVC)</text>

  <rect x="215" y="335" width="180" height="55" rx="2" fill="#c6f6d5" stroke="#38a169" stroke-width="1.5"/>
  <text x="305" y="355" font-family="Consolas, monospace" font-size="9" font-weight="600" fill="#38a169" text-anchor="middle">WEAVIATE</text>
  <text x="305" y="370" font-family="Consolas, monospace" font-size="7" fill="#4a5568" text-anchor="middle">Vector DB + FQDN Resolver</text>
  <text x="305" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="7" fill="#718096" text-anchor="middle">StatefulSet (50Gi PVC)</text>

  <!-- Backend to Redis (enqueue tasks) -->
  <line x1="170" y1="152" x2="213" y2="152" stroke="#4a5568" stroke-width="1" marker-end="url(#dot)"/>

  <!-- Batch to Redis (read tasks) -->
  <line x1="280" y1="248" x2="280" y2="177" stroke="#4a5568" stroke-width="1" marker-end="url(#dot)"/>

  <!-- Ray Head to each Worker (thin gray lines) -->
  <line x1="467" y1="175" x2="467" y2="195" stroke="#a0aec0" stroke-width="0.5"/>
  <line x1="402" y1="195" x2="532" y2="195" stroke="#a0aec0" stroke-width="0.5"/>
  <line x1="402" y1="195" x2="402" y2="248" stroke="#a0aec0" stroke-width="0.5"/>
  <line x1="467" y1="195" x2="467" y2="248" stroke="#a0aec0" stroke-width="0.5"/>
  <line x1="532" y1="195" x2="532" y2="248" stroke="#a0aec0" stroke-width="0.5"/>

  <!-- Batch to Ray -->
  <line x1="345" y1="277" x2="373" y2="277" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Labels ON TOP of lines (z-order) -->
  <rect x="210" y="206" width="205" height="14" fill="#faf5ff"/>
  <text x="215" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" fill="#7b1fa2">SPOT POOL (Cost-effective, preemptible)</text>
  <rect x="210" y="228" width="120" height="14" fill="#faf5ff"/>
  <text x="215" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="600" fill="#2b6cb0">Batch Workers (4 replicas)</text>
  <rect x="370" y="228" width="85" height="14" fill="#faf5ff"/>
  <text x="375" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="600" fill="#d69e2e">Ray Workers (4-8)</text>

  <!-- Pipeline labels (aligned with Weaviate box x=215) -->
  <text x="215" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="7" fill="#718096">Documents: Parse (Batch) → Chunk → Embed → Store (Ray)</text>
  <text x="215" y="423" font-family="Segoe UI, Arial, sans-serif" font-size="7" fill="#718096">Models: Extract → Chunk → Embed → Store (Ray)</text>
  <!-- Tolerations aligned to purple dashed border -->
  <text x="215" y="455" font-family="Segoe UI, Arial, sans-serif" font-size="6" fill="#7b1fa2">Tolerations: kubernetes.azure.com/scalesetpriority=spot</text>

  <!-- External Services -->
  <rect x="595" y="85" width="150" height="200" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="670" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#718096" text-anchor="middle">EXTERNAL SERVICES</text>

  <rect x="610" y="120" width="120" height="45" rx="2" fill="#f1f8e9" stroke="#33691e" stroke-width="1.5"/>
  <text x="670" y="140" font-family="Consolas, monospace" font-size="9" font-weight="600" fill="#33691e" text-anchor="middle">AZURE SQL</text>
  <text x="670" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="7" fill="#4a5568" text-anchor="middle">Database</text>

  <rect x="610" y="175" width="120" height="45" rx="2" fill="#f1f8e9" stroke="#33691e" stroke-width="1.5"/>
  <text x="670" y="195" font-family="Consolas, monospace" font-size="9" font-weight="600" fill="#33691e" text-anchor="middle">AZURE OPENAI</text>
  <text x="670" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="7" fill="#4a5568" text-anchor="middle">GPT + Embeddings</text>

  <rect x="610" y="230" width="120" height="45" rx="2" fill="#f1f8e9" stroke="#33691e" stroke-width="1.5"/>
  <text x="670" y="250" font-family="Consolas, monospace" font-size="9" font-weight="600" fill="#33691e" text-anchor="middle">AZURE BLOB</text>
  <text x="670" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="7" fill="#4a5568" text-anchor="middle">Storage</text>

  <!-- Legend -->
  <rect x="595" y="300" width="150" height="155" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="670" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#4a5568" text-anchor="middle">Legend</text>

  <rect x="610" y="335" width="18" height="12" fill="#f0fff4" stroke="#38a169" stroke-width="1"/>
  <text x="635" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="7" fill="#4a5568">System Pool</text>

  <rect x="610" y="355" width="18" height="12" fill="#faf5ff" stroke="#7b1fa2" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="635" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="7" fill="#4a5568">Spot Pool</text>

  <rect x="610" y="375" width="18" height="12" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1"/>
  <text x="635" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="7" fill="#4a5568">Backend/Batch</text>

  <rect x="610" y="395" width="18" height="12" fill="#fef3c7" stroke="#d69e2e" stroke-width="1"/>
  <text x="635" y="405" font-family="Segoe UI, Arial, sans-serif" font-size="7" fill="#4a5568">Ray Cluster</text>

  <rect x="610" y="415" width="18" height="12" fill="#fed7d7" stroke="#e53e3e" stroke-width="1"/>
  <text x="635" y="425" font-family="Segoe UI, Arial, sans-serif" font-size="7" fill="#4a5568">Redis</text>

  <rect x="610" y="435" width="18" height="12" fill="#c6f6d5" stroke="#38a169" stroke-width="1"/>
  <text x="635" y="445" font-family="Segoe UI, Arial, sans-serif" font-size="7" fill="#4a5568">Weaviate</text>

  <!-- Connections to external (from center of boxes) -->
  <!-- W1 Embed → Azure OpenAI -->
  <line x1="495" y1="277" x2="610" y2="200" stroke="#a0aec0" stroke-width="0.5" stroke-dasharray="4,2"/>
  <!-- WN Store → Weaviate -->
  <line x1="532" y1="305" x2="395" y2="335" stroke="#a0aec0" stroke-width="0.5" stroke-dasharray="4,2"/>
</svg>
