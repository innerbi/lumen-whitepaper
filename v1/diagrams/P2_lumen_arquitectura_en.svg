  <text x="130" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#718096" text-anchor="middle">DAX</text>
  
  <rect x="220" y="130" width="140" height="50" rx="2" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="290" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3748" text-anchor="middle">Document Analyst</text>
  <text x="290" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#718096" text-anchor="middle">RAG</text>
  
  <rect x="380" y="130" width="140" height="50" rx="2" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3748" text-anchor="middle">Reporting</text>
  <text x="450" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#718096" text-anchor="middle">Power BI</text>
  
