  <text x="115" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#718096" text-anchor="middle">LLM</text>
  
  <rect x="185" y="575" width="110" height="45" rx="2" fill="#ffffff" stroke="#a0aec0" stroke-width="1" filter="url(#shadow)"/>
