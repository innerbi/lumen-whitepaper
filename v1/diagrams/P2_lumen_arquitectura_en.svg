<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 720" width="850" height="720">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.1"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="850" height="720" fill="none"/>
  
  <!-- Layer 1: LUMEN (Top) -->
  <rect x="40" y="25" width="770" height="55" rx="0" fill="#1a365d" filter="url(#shadow)"/>
  <text x="425" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">LUMEN</text>
  
  <!-- Layer 2: Capabilities -->
  <rect x="40" y="95" width="770" height="100" rx="0" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#718096" font-weight="500">CAPABILITIES</text>
  
  <!-- Capability boxes -->
