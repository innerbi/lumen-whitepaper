  <rect x="310" y="575" width="110" height="45" rx="2" fill="#ffffff" stroke="#a0aec0" stroke-width="1" filter="url(#shadow)"/>
  <text x="365" y="595" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#2d3748" text-anchor="middle">SQL Server</text>
  <text x="365" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#718096" text-anchor="middle">Database</text>
  
  <rect x="435" y="575" width="110" height="45" rx="2" fill="#ffffff" stroke="#a0aec0" stroke-width="1" filter="url(#shadow)"/>
  <text x="490" y="595" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#2d3748" text-anchor="middle">Redis</text>
  <text x="490" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#718096" text-anchor="middle">Cache</text>
  
  <rect x="560" y="575" width="110" height="45" rx="2" fill="#ffffff" stroke="#a0aec0" stroke-width="1" filter="url(#shadow)"/>
  <text x="615" y="595" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#2d3748" text-anchor="middle">OAuth</text>
  <text x="615" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#718096" text-anchor="middle">Auth</text>
  
  <rect x="685" y="575" width="110" height="45" rx="2" fill="#ffffff" stroke="#a0aec0" stroke-width="1" filter="url(#shadow)"/>
  <text x="740" y="595" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#2d3748" text-anchor="middle">MCP</text>
  <text x="740" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#718096" text-anchor="middle">Protocol</text>
  
