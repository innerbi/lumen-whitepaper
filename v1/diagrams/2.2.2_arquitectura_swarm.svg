<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <!-- Background -->
  <rect width="800" height="550" fill="none"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <!-- Arrowhead marker -->
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
    </marker>
    <marker id="arrowhead-rev" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="800" height="550" fill="url(#grid)" opacity="0.5"/>

  <!-- Title bar -->
  <rect x="25" y="20" width="750" height="60" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="400" y="57" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">ARQUITECTURA SWARM (Enjambre)</text>

  <!-- Main container (10px gap below title) -->
  <rect x="25" y="90" width="750" height="440" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- MESH TOPOLOGY - Agents arranged in diamond pattern -->

  <!-- Agent 1 - Top -->
  <rect x="377" y="120" width="46" height="40" rx="4" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="146" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>

  <!-- Agent 2 - Left -->
  <rect x="177" y="195" width="46" height="40" rx="4" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
  <text x="200" y="221" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>

  <!-- Agent 3 - Right -->
  <rect x="577" y="195" width="46" height="40" rx="4" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="221" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>

  <!-- Agent 4 - Center Left -->
  <rect x="277" y="270" width="46" height="40" rx="4" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
  <text x="300" y="296" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>

  <!-- Agent 5 - Center Right -->
  <rect x="477" y="270" width="46" height="40" rx="4" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
  <text x="500" y="296" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>

  <!-- Agent 6 - Bottom (dynamic entry) -->
  <rect x="377" y="345" width="46" height="40" rx="4" fill="#1a1a1a" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="400" y="371" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#22c55e" text-anchor="middle">A</text>
  <text x="440" y="371" font-family="Arial, sans-serif" font-size="10" fill="#22c55e">← join/leave</text>

  <!-- MESH CONNECTIONS (P2P bidirectional) -->

  <!-- Top to Left -->
  <line x1="377" y1="150" x2="223" y2="195" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowhead)" marker-start="url(#arrowhead-rev)"/>

  <!-- Top to Right -->
  <line x1="423" y1="150" x2="577" y2="195" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowhead)" marker-start="url(#arrowhead-rev)"/>

  <!-- Left to Center-Left -->
  <line x1="223" y1="235" x2="277" y2="270" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowhead)" marker-start="url(#arrowhead-rev)"/>

  <!-- Right to Center-Right -->
  <line x1="577" y1="235" x2="523" y2="270" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowhead)" marker-start="url(#arrowhead-rev)"/>

  <!-- Center-Left to Center-Right (horizontal) -->
  <line x1="323" y1="290" x2="477" y2="290" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowhead)" marker-start="url(#arrowhead-rev)"/>

  <!-- Top to Center-Left (diagonal) -->
  <line x1="385" y1="160" x2="315" y2="270" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Top to Center-Right (diagonal) -->
  <line x1="415" y1="160" x2="485" y2="270" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Center-Left to Bottom -->
  <line x1="315" y1="310" x2="377" y2="345" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Center-Right to Bottom -->
  <line x1="485" y1="310" x2="423" y2="345" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Características section -->
  <text x="55" y="395" font-family="Arial, sans-serif" font-size="14" fill="#888888">Características:</text>

  <circle cx="55" cy="420" r="3" fill="#3b82f6"/>
  <text x="70" y="425" font-family="Arial, sans-serif" font-size="12" fill="#888888">Topología MESH: cada agente conecta con múltiples vecinos</text>

  <circle cx="55" cy="445" r="3" fill="#3b82f6"/>
  <text x="70" y="450" font-family="Arial, sans-serif" font-size="12" fill="#888888">SIN coordinador central (a diferencia de Blackboard)</text>

  <circle cx="55" cy="470" r="3" fill="#3b82f6"/>
  <text x="70" y="475" font-family="Arial, sans-serif" font-size="12" fill="#888888">Comunicación P2P directa entre agentes</text>

  <circle cx="55" cy="495" r="3" fill="#22c55e"/>
  <text x="70" y="500" font-family="Arial, sans-serif" font-size="12" fill="#888888">Alta tolerancia a fallos (red se auto-repara)</text>

</svg>
