<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="280" height="70">
  <style>
    .formula { font-family: 'Times New Roman', 'STIX Two Math', serif; font-size: 20px; fill: #1a1a1a; }
    .formula-italic { font-family: 'Times New Roman', 'STIX Two Math', serif; font-size: 20px; font-style: italic; fill: #1a1a1a; }
    .subscript { font-size: 14px; }
    .superscript { font-size: 14px; }
    .mathbb { font-family: 'Times New Roman', serif; font-size: 20px; font-weight: bold; fill: #1a1a1a; }
  </style>

  <!-- W_{ij}^* = η · E[δ · c_{ij}] / λ -->
  <text x="10" y="40" class="formula-italic">W</text>
  <text x="26" y="47" class="formula subscript">ij</text>
  <text x="40" y="30" class="formula superscript">*</text>

  <text x="55" y="40" class="formula"> = </text>

  <!-- Fraction line -->
  <line x1="85" y1="35" x2="240" y2="35" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Numerator: η · E[δ · c_{ij}] -->
  <text x="100" y="25" class="formula-italic">η</text>
  <text x="115" y="25" class="formula"> · </text>
  <text x="130" y="25" class="mathbb">E</text>
  <text x="145" y="25" class="formula">[</text>
  <text x="152" y="25" class="formula-italic">δ</text>
  <text x="165" y="25" class="formula"> · </text>
  <text x="180" y="25" class="formula-italic">c</text>
  <text x="192" y="30" class="formula subscript">ij</text>
  <text x="205" y="25" class="formula">]</text>

  <!-- Denominator: λ -->
  <text x="155" y="55" class="formula-italic">λ</text>
</svg>
