<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530">
  <!-- Background -->
  <rect width="800" height="530" fill="none"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="530" fill="url(#grid)" opacity="0.5"/>

  <!-- Title bar -->
  <rect x="25" y="20" width="750" height="60" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="400" y="57" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">ARQUITECTURA MODULAR</text>

  <!-- Main container (10px gap below title) -->
  <rect x="25" y="90" width="750" height="420" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Module 1: Percepción -->
  <rect x="50" y="125" width="160" height="240" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="130" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Percepción</text>

  <rect x="65" y="165" width="130" height="40" rx="2" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="130" y="191" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">Visión</text>

  <rect x="65" y="220" width="130" height="40" rx="2" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="130" y="246" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">Audio</text>

  <rect x="65" y="275" width="130" height="40" rx="2" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="130" y="301" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">Sensores</text>

  <!-- Module 2: Razonamiento -->
  <rect x="230" y="125" width="160" height="240" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="310" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Razonamiento</text>

  <rect x="245" y="165" width="130" height="40" rx="2" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="310" y="191" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">Lógica</text>

  <rect x="245" y="220" width="130" height="40" rx="2" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="310" y="246" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">Probabilístico</text>

  <rect x="245" y="275" width="130" height="40" rx="2" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="310" y="301" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">Heurístico</text>

  <!-- Module 3: Planificación -->
  <rect x="410" y="125" width="160" height="240" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="490" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Planificación</text>

  <rect x="425" y="165" width="130" height="40" rx="2" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="490" y="191" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">Tareas</text>

  <rect x="425" y="220" width="130" height="40" rx="2" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="490" y="246" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">Rutas</text>

  <rect x="425" y="275" width="130" height="40" rx="2" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="490" y="301" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">Recursos</text>

  <!-- Module 4: Acción -->
  <rect x="590" y="125" width="160" height="240" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="670" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Acción</text>

  <rect x="605" y="165" width="130" height="40" rx="2" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="670" y="191" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">Motor</text>

  <rect x="605" y="220" width="130" height="40" rx="2" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="670" y="246" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">API</text>

  <rect x="605" y="275" width="130" height="40" rx="2" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="670" y="301" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">Efectores</text>

  <!-- Vertical lines from modules to bus -->
  <line x1="130" y1="365" x2="130" y2="415" stroke="#888888" stroke-width="1"/>
  <polygon points="126,405 130,415 134,405" fill="#888888"/>
  <polygon points="126,375 130,365 134,375" fill="#888888"/>

  <line x1="310" y1="365" x2="310" y2="415" stroke="#888888" stroke-width="1"/>
  <polygon points="306,405 310,415 314,405" fill="#888888"/>
  <polygon points="306,375 310,365 314,375" fill="#888888"/>

  <line x1="490" y1="365" x2="490" y2="415" stroke="#888888" stroke-width="1"/>
  <polygon points="486,405 490,415 494,405" fill="#888888"/>
  <polygon points="486,375 490,365 494,375" fill="#888888"/>

  <line x1="670" y1="365" x2="670" y2="415" stroke="#888888" stroke-width="1"/>
  <polygon points="666,405 670,415 674,405" fill="#888888"/>
  <polygon points="666,375 670,365 674,375" fill="#888888"/>

  <!-- Bus de Mensajes -->
  <rect x="50" y="425" width="700" height="55" rx="4" fill="#1a1a1a" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="400" y="458" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">BUS DE MENSAJES</text>

</svg>
