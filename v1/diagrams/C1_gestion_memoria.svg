<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.1"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="380" fill="none"/>
  
  <!-- Header -->
  <rect x="40" y="25" width="620" height="50" rx="0" fill="#1a365d" filter="url(#shadow)"/>
  <text x="350" y="57" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">GESTIÓN DE MEMORIA</text>
  
  <!-- Main container -->
  <rect x="40" y="90" width="620" height="250" rx="0" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Messages list -->
  <text x="70" y="130" font-family="Consolas, monospace" font-size="13" fill="#4a5568">Mensaje 1</text>
  <text x="70" y="155" font-family="Consolas, monospace" font-size="13" fill="#4a5568">Mensaje 2</text>
  <text x="70" y="180" font-family="Consolas, monospace" font-size="13" fill="#4a5568">Mensaje 3</text>
  <text x="70" y="205" font-family="Consolas, monospace" font-size="13" fill="#718096">...</text>
  <text x="70" y="230" font-family="Consolas, monospace" font-size="13" fill="#4a5568">Mensaje N-1</text>
  
  <!-- Bracket for messages -->
  <path d="M 165 120 L 175 120 L 175 235 L 165 235" fill="none" stroke="#4a5568" stroke-width="1.5"/>
  
  <!-- Arrow to summarizer -->
  <line x1="175" y1="177" x2="230" y2="177" stroke="#2b6cb0" stroke-width="1.5"/>
  <polygon points="225,173 235,177 225,181" fill="#2b6cb0"/>
  
  <!-- Summarizer box -->
  <rect x="240" y="155" width="140" height="45" rx="2" fill="#ffffff" stroke="#2b6cb0" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="183" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3748" text-anchor="middle">SUMMARIZER</text>
  
  <!-- Arrow from summarizer -->
  <line x1="380" y1="177" x2="435" y2="177" stroke="#2b6cb0" stroke-width="1.5"/>
  <polygon points="430,173 440,177 430,181" fill="#2b6cb0"/>
  
  <!-- Output text -->
  <text x="450" y="183" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d3748">Resumen compacto</text>
  
  <!-- Separator line -->
  <line x1="60" y1="255" x2="640" y2="255" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Recent messages section -->
  <text x="70" y="285" font-family="Consolas, monospace" font-size="13" fill="#2b6cb0" font-weight="600">Mensaje N</text>
  <line x1="165" y1="280" x2="380" y2="280" stroke="#2b6cb0" stroke-width="1.5"/>
  <polygon points="375,276 385,280 375,284" fill="#2b6cb0"/>
  <text x="400" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d3748">Contexto completo</text>
  
  <text x="70" y="310" font-family="Consolas, monospace" font-size="13" fill="#2b6cb0" font-weight="600">Mensaje N+1</text>
  <line x1="175" y1="305" x2="380" y2="305" stroke="#2b6cb0" stroke-width="1.5"/>
  <polygon points="375,301 385,305 375,309" fill="#2b6cb0"/>
  <text x="400" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2d3748">Contexto completo</text>
  
  <!-- Footer formula -->
  <rect x="40" y="340" width="620" height="35" rx="0" fill="#edf2f7" stroke="#e2e8f0" stroke-width="1"/>
  <text x="350" y="363" font-family="Consolas, monospace" font-size="12" fill="#4a5568" text-anchor="middle">[ Working Memory = Resumen + Mensajes Recientes ]</text>
  
</svg>
