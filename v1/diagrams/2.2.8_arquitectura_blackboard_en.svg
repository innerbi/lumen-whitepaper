<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">     
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="530" fill="none"/>
  <rect width="800" height="530" fill="url(#grid)" opacity="0.4"/>

  <!-- Title bar -->
  <rect x="25" y="20" width="750" height="60" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="400" y="57" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">BLACKBOARD ARCHITECTURE</text>

  <!-- Main container -->
  <rect x="25" y="90" width="750" height="420" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Agents -->
  <rect x="55" y="125" width="130" height="55" rx="8" fill="#141414" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)"/>
  <text x="120" y="160" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Agent A</text>

  <rect x="205" y="125" width="130" height="55" rx="8" fill="#141414" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)"/>
  <text x="270" y="160" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Agent B</text>

  <rect x="355" y="125" width="130" height="55" rx="8" fill="#141414" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)"/>
  <text x="420" y="160" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Agent C</text>

  <rect x="505" y="125" width="130" height="55" rx="8" fill="#141414" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)"/>
  <text x="570" y="160" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Agent D</text>

  <!-- Connections -->
  <path d="M 120 180 V 300 M 270 180 V 300 M 420 180 V 300 M 570 180 V 300" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>

  <!-- Blackboard main box -->
  <rect x="50" y="300" width="700" height="165" rx="8" fill="#0d1117" stroke="#444444" stroke-width="1"/>

  <!-- Blackboard header -->
  <rect x="50" y="300" width="700" height="45" rx="8" fill="#1a2332"/>
  <text x="400" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3b82f6" text-anchor="middle">SHARED STATE (BLACKBOARD)</text>

  <!-- Column 1 -->
  <circle cx="90" cy="370" r="4" fill="#3b82f6"/>
  <text x="110" y="375" font-family="Arial, sans-serif" font-size="13" fill="#888888">Frequencies / Data</text>

  <circle cx="90" cy="405" r="4" fill="#3b82f6"/>
  <text x="110" y="410" font-family="Arial, sans-serif" font-size="13" fill="#888888">Intermediate results</text>

  <circle cx="90" cy="440" r="4" fill="#3b82f6"/>
  <text x="110" y="445" font-family="Arial, sans-serif" font-size="13" fill="#888888">Hypotheses</text>

  <!-- Column 2 -->
  <circle cx="410" cy="370" r="4" fill="#3b82f6"/>
  <text x="430" y="375" font-family="Arial, sans-serif" font-size="13" fill="#888888">Agent Messages</text>

  <circle cx="410" cy="405" r="4" fill="#3b82f6"/>
  <text x="430" y="410" font-family="Arial, sans-serif" font-size="13" fill="#888888">Active Tasks</text>

  <circle cx="410" cy="440" r="4" fill="#3b82f6"/>
  <text x="430" y="445" font-family="Arial, sans-serif" font-size="13" fill="#888888">Final Solutions</text>

</svg>