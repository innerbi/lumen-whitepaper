<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 380" width="750" height="380">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.1"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="750" height="380" fill="none"/>
  <rect x="40" y="25" width="670" height="50" rx="0" fill="#1a365d" filter="url(#shadow)"/>
  <text x="375" y="57" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">INTEGRACIÓN MCP</text>
  <rect x="40" y="90" width="670" height="260" rx="0" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="70" y="120" width="120" height="50" rx="3" fill="#ffffff" stroke="#2b6cb0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="120" width="120" height="5" fill="#2b6cb0"/>
  <text x="130" y="153" font-family="Consolas, monospace" font-size="13" font-weight="600" fill="#2b6cb0" text-anchor="middle">Agent</text>
  <line x1="190" y1="145" x2="250" y2="145" stroke="#4a5568" stroke-width="2"/>
  <polygon points="245,141 255,145 245,149" fill="#4a5568"/>
  <rect x="260" y="120" width="160" height="50" rx="3" fill="#ffffff" stroke="#805ad5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="260" y="120" width="160" height="5" fill="#805ad5"/>
  <text x="340" y="153" font-family="Consolas, monospace" font-size="13" font-weight="600" fill="#805ad5" text-anchor="middle">MCP Wrapper</text>
  <line x1="420" y1="145" x2="480" y2="145" stroke="#4a5568" stroke-width="2"/>
  <polygon points="475,141 485,145 475,149" fill="#4a5568"/>
  <rect x="490" y="110" width="190" height="70" rx="3" fill="#ffffff" stroke="#e53e3e" stroke-width="2" filter="url(#shadow)"/>
  <rect x="490" y="110" width="190" height="5" fill="#e53e3e"/>
  <text x="585" y="143" font-family="Consolas, monospace" font-size="13" font-weight="600" fill="#e53e3e" text-anchor="middle">MCP Server</text>
  <text x="585" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#718096" text-anchor="middle">(PowerBI, Semantic)</text>
  <text x="70" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#2d3748">Proceso:</text>
  <text x="70" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5568">1. Agent inicializa con enable_mcp_tools=True</text>
  <text x="70" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5568">2. MCPToolsWrapper descubre tools del servidor</text>
  <text x="70" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5568">3. Tools se exponen como @ai_function al LLM</text>
  <text x="70" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5568">4. LLM invoca tools MCP transparentemente</text>
</svg>
