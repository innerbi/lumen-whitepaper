<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530">
  <!-- Background -->
  <rect width="800" height="530" fill="none"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="530" fill="url(#grid)" opacity="0.5"/>

  <!-- Title bar -->
  <rect x="25" y="20" width="750" height="60" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="400" y="57" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">ARQUITECTURA ORQUESTADOR-TRABAJADOR</text>

  <!-- Main container (10px gap below title) -->
  <rect x="25" y="90" width="750" height="420" rx="4" fill="#121212" stroke="#333333" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Orquestador box -->
  <rect x="250" y="120" width="300" height="180" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="400" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">ORQUESTADOR</text>

  <circle cx="280" cy="190" r="3" fill="#3b82f6"/>
  <text x="295" y="195" font-family="Arial, sans-serif" font-size="12" fill="#888888">Recibe tarea</text>

  <circle cx="280" cy="220" r="3" fill="#3b82f6"/>
  <text x="295" y="225" font-family="Arial, sans-serif" font-size="12" fill="#888888">Descompone</text>

  <circle cx="280" cy="250" r="3" fill="#3b82f6"/>
  <text x="295" y="255" font-family="Arial, sans-serif" font-size="12" fill="#888888">Asigna</text>

  <circle cx="280" cy="280" r="3" fill="#3b82f6"/>
  <text x="295" y="285" font-family="Arial, sans-serif" font-size="12" fill="#888888">Consolida</text>

  <!-- Connection lines from orquestador to workers -->
  <line x1="400" y1="300" x2="400" y2="340" stroke="#888888" stroke-width="1"/>

  <!-- Horizontal line -->
  <line x1="130" y1="340" x2="670" y2="340" stroke="#888888" stroke-width="1"/>

  <!-- Vertical lines to workers -->
  <line x1="130" y1="340" x2="130" y2="380" stroke="#888888" stroke-width="1"/>
  <polygon points="126,375 130,385 134,375" fill="#888888"/>

  <line x1="400" y1="340" x2="400" y2="380" stroke="#888888" stroke-width="1"/>
  <polygon points="396,375 400,385 404,375" fill="#888888"/>

  <line x1="670" y1="340" x2="670" y2="380" stroke="#888888" stroke-width="1"/>
  <polygon points="666,375 670,385 674,375" fill="#888888"/>

  <!-- Worker A -->
  <rect x="50" y="395" width="160" height="80" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="130" y="430" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Worker A</text>
  <text x="130" y="455" font-family="Arial, sans-serif" font-size="11" fill="#888888" text-anchor="middle">(DAX)</text>

  <!-- Worker B -->
  <rect x="320" y="395" width="160" height="80" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Worker B</text>
  <text x="400" y="455" font-family="Arial, sans-serif" font-size="11" fill="#888888" text-anchor="middle">(Docs)</text>

  <!-- Worker C -->
  <rect x="590" y="395" width="160" height="80" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="670" y="430" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Worker C</text>
  <text x="670" y="455" font-family="Arial, sans-serif" font-size="11" fill="#888888" text-anchor="middle">(Reports)</text>

</svg>
